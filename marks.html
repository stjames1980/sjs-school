<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Result Software – SJS App</title>
<meta name="theme-color" content="#13294b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Merriweather:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sjs-common.css">
<style>
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:12px}
.k{border-radius:14px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#13294b,#2a4f8f);box-shadow:0 6px 16px rgba(19,41,75,.14)}
.k b{display:block;font-size:24px;font-weight:800;line-height:1.15}.k span{font-size:10.5px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.k.g{background:linear-gradient(135deg,#0b6b3a,#1aa35c)}.k.r{background:linear-gradient(135deg,#9a2323,#d84848)}.k.y{background:linear-gradient(135deg,#9a7412,#d4ab2c)}.k.p{background:linear-gradient(135deg,#4a2a8a,#7c56c8)}
.bar{height:9px;border-radius:99px;background:#edf0f5;overflow:hidden;flex:1 1 80px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1d3d6e,#3f73c4)}
.bar.g i{background:linear-gradient(90deg,#0b6b3a,#22b866)}.bar.r i{background:linear-gradient(90deg,#b62d2d,#e26a6a)}.bar.y i{background:linear-gradient(90deg,#b98a12,#e5c04a)}
.gdist{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:16px}.gdist div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.gdist i{display:block;background:linear-gradient(180deg,#3f73c4,#13294b);border-radius:6px 6px 0 0;min-height:2px}.gdist em{font-style:normal;color:var(--navy);font-size:12px}
.et th,.et td{padding:5px 4px;text-align:center}.et td.nm,.et th.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1;max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et th.nm{background:#f8f9fb}.et .mk{width:56px}.et th .mx{width:52px;padding:3px;text-align:center;font-weight:700;margin-top:3px}
.et td.tt{font-weight:800;color:var(--navy)}
.pg{font-size:11px;font-weight:700;border-radius:8px;padding:3px 6px;display:inline-block;min-width:46px;text-align:center}
.pg.z{background:#f1f3f7;color:#8a93a3}.pg.h{background:var(--warnbg);color:#6b4b00}.pg.f{background:var(--goodbg);color:#075f07}
#sync{position:fixed;left:10px;bottom:18px;z-index:90;font:700 11.5px/1 system-ui,sans-serif;padding:9px 12px;border-radius:99px;background:#e4f6e4;color:#075f07;box-shadow:0 4px 14px rgba(0,0,0,.14)}
#sync.off{background:#fff3d6;color:#6b4b00}#sync.p{background:#e3eefb;color:#174d8f}
.stu{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.stu .h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}.cg label{font-size:11px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.cg .inp{padding:6px 8px}
.red{color:var(--crit);font-weight:700}
details.grp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}details.grp summary{font-weight:700;color:var(--navy);cursor:pointer}
@media(max-width:480px){.et td.nm,.et th.nm{max-width:92px}.et .mk{width:42px;padding:7px 2px}.et th{font-size:9.5px}.et th .mx{width:40px}.et td,.et th{padding:4px 2px}}
@media print{#sync{display:none!important}}
</style>
</head>
<body>
<script src="config.js"></script>
<script src="sjs-common.js"></script>
<script>
/* ===== SJS Result Software (CBSE pattern, Nursery – XII) =====
   Works online and offline: marks are saved on the phone first and upload by themselves when the internet returns.
   mk_cfg/cbse   class groups (terms, exams, weights), subjects, grades, school details          (Admin)
   mk_cfg/main   locked:{examId:true}  – a locked exam can be changed only by the Admin              (Admin)
   c/<classId>/marks/<examId>__<subject>   {exam, subj, max, m:{roll: mark or "AB"}, by, byName, at}
   c/<classId>/marks/x_<termId>__att | __rem | __c<Area>   attendance, remarks, co-scholastic grades for a term */
const {$,esc,toast,sheet,closeSheet,csvDownload,pasteRows,classLabel,waPhone}=SJS;
const ROM=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const CBSE_T=(n,pt,ex,exn)=>({id:'t'+n,name:'Term '+n,comps:[{id:'pt'+n,name:pt,max:10},{id:'nb'+n,name:'Note Book',max:5},{id:'se'+n,name:'Sub. Enrichment',max:5},{id:ex,name:exn,max:80}]});
const DEF={
  school:{motto:'Faith And Service',address:'Gongrai, PO. Kendraicherra, Dist-Sepahijala, Tripura-799102',affil:'2030038',code:'35414',udise:'16050401504',email:'stjames579@gmail.com'},
  pass:33,compMax:2,rankPassOnly:true,
  grades:[{min:91,g:'A1'},{min:81,g:'A2'},{min:71,g:'B1'},{min:61,g:'B2'},{min:51,g:'C1'},{min:41,g:'C2'},{min:33,g:'D'},{min:0,g:'E'}],
  schemes:[
   {id:'pp',name:'Pre-Primary (Nursery – KG)',classes:'Nursery, LKG, UKG, KG, KG-I, KG-II',final:'avg',sepPass:false,cos:'Conversation, Rhymes & Recitation, Drawing & Colouring, Handwriting, Games, Discipline',cosScale:'A, B, C',
    subjects:'English, Mathematics, Hindi, EVS, Rhymes*, Drawing*',
    terms:[{id:'t1',name:'Term 1',comps:[{id:'pt1',name:'PT-I',max:20},{id:'hy',name:'Half Yearly',max:80}]},{id:'t2',name:'Term 2',comps:[{id:'pt2',name:'PT-II',max:20},{id:'an',name:'Annual',max:80}]}]},
   {id:'pri',name:'Primary (Class I – V)',classes:'I, II, III, IV, V',final:'avg',sepPass:false,cos:'Work Education, Art Education, Health & Physical Education, Discipline',cosScale:'A, B, C',
    subjects:'English, Hindi, Mizo/Bengali, Mathematics, EVS, Computer, G.K.*, Drawing*',terms:[CBSE_T(1,'PT-I','hy','Half Yearly'),CBSE_T(2,'PT-II','an','Annual')]},
   {id:'mid',name:'Middle (Class VI – VIII)',classes:'VI, VII, VIII',final:'avg',sepPass:false,cos:'Work Education, Art Education, Health & Physical Education, Discipline',cosScale:'A, B, C',
    subjects:'English, Hindi, Mizo/Bengali, Mathematics, Science, Social Science, Computer',terms:[CBSE_T(1,'PT-I','hy','Half Yearly'),CBSE_T(2,'PT-II','an','Annual')]},
   {id:'sec',name:'Secondary (Class IX – X)',classes:'IX, X',final:'avg',sepPass:false,cos:'Work Education, Art Education, Health & Physical Education, Discipline',cosScale:'A, B, C, D, E',
    subjects:'English, Hindi/Mizo/Bengali, Mathematics, Science, Social Science, Information Technology',terms:[CBSE_T(1,'PT-I','hy','Half Yearly'),CBSE_T(2,'PT-II','an','Annual')]},
   {id:'sr',name:'Senior Secondary (Class XI – XII)',classes:'XI, XII',final:'last',sepPass:true,cos:'Work Experience, Health & Physical Education, General Studies, Discipline',cosScale:'A, B, C, D, E',
    subjects:'English Core, Physics [70+30], Chemistry [70+30], Biology [70+30], Mathematics, Computer Science [70+30], Physical Education [70+30], History, Political Science, Geography [70+30], Economics, Accountancy, Business Studies',
    terms:[{id:'t1',name:'Term 1',comps:[{id:'pt1',name:'PT-I',max:25,wt:0},{id:'hy',name:'Half Yearly Theory',max:80,kind:'T'},{id:'hyp',name:'Practical / IA',max:20,kind:'P'}]},
           {id:'t2',name:'Term 2',comps:[{id:'pt2',name:'PT-II',max:25,wt:0},{id:'an',name:'Annual Theory',max:80,kind:'T'},{id:'anp',name:'Practical / IA',max:20,kind:'P'}]}]}],
  subj:{}};
let CFG=null,OLD=null;                       // mk_cfg/cbse , mk_cfg/main
const C={};                                  // class data cache: cid -> {students, marks}
const M={tab:'dash',cid:null,view:'t1',term:'t1',subj:null,comp:'all',dirty:{},maxd:{},scope:'sec',cos:null,school:null};
const LSK='sjs-res-';const lg=k=>{try{return localStorage.getItem(LSK+k)}catch(e){return null}};const ls=(k,v)=>{try{localStorage.setItem(LSK+k,v)}catch(e){}};
const cfg=()=>CFG||DEF;
const locked=id=>!!((OLD&&OLD.locked)||{})[id];
const cls=cid=>SJS.classes.find(c=>c.id===cid);
const skey=s=>String(s).replace(/[^A-Za-z0-9]/g,'').slice(0,20)||'S';
const nc=s=>{let t=String(s||'').toUpperCase().replace(/CLASS|STD|[^A-Z0-9]/g,'');if(/^\d+$/.test(t)&&+t>=1&&+t<=12)t=ROM[+t];return t};
const toks=s=>String(s||'').split(',').map(nc).filter(Boolean);
const r2=x=>Math.round(x*100)/100;
const fmt=v=>v==null||v===''?'':v==='AB'?'AB':String(Math.round(v*10)/10);
const grade=p=>{if(p==null)return'';const x=Math.round(p);const g=[...cfg().grades].sort((a,b)=>b.min-a.min).find(q=>x>=q.min);return g?g.g:''};
const dirtyN=()=>Object.keys(M.dirty).length+Object.keys(M.maxd).length+(M.cos?1:0);
const FB=()=>!!(window.firebase&&firebase.apps&&firebase.apps.length);

/* ---------- data: works from the phone's saved copy when there is no internet ---------- */
async function LIST(c){if(!FB())return SJS.db.list(c);const q=firebase.firestore().collection(c);let s;
  try{s=navigator.onLine?await q.get():await q.get({source:'cache'})}catch(e){s=await q.get({source:'cache'})}
  return s.docs.map(d=>({id:d.id,...d.data()}))}
let PEND=0;
function sync(){let el=$('#sync');if(!el){el=document.createElement('div');el.id='sync';document.body.appendChild(el)}const on=navigator.onLine;
  el.className=PEND?'p':on?'':'off';el.textContent=PEND?(on?'⟳ Saving…':'● Offline · '+PEND+' saved on this phone'):(on?'● Online · all saved':'● Offline · you can keep working')}
function WRITE(path,data,merge){const p=FB()?firebase.firestore().doc(path).set(data,merge?{merge:true}:{}):SJS.db.set(path,data,merge);
  PEND++;sync();const done=()=>{PEND=Math.max(0,PEND-1);sync()};
  p.then(done,e=>{done();toast(e&&e.code==='permission-denied'?'Not allowed – this exam is locked, or the Admin has not confirmed you':'A save did not go through – please try again')});
  return navigator.onLine?Promise.race([p.catch(()=>{}),new Promise(r=>setTimeout(r,4000))]):Promise.resolve()}
window.addEventListener('online',sync);window.addEventListener('offline',sync);
async function load(cid,force){if(C[cid]&&!force)return C[cid];const [st,mk]=await Promise.all([LIST('c/'+cid+'/students'),LIST('c/'+cid+'/marks')]);
  const marks={};mk.forEach(d=>marks[d.id]=d);C[cid]={students:st.sort((a,b)=>(+a.roll||0)-(+b.roll||0)||String(a.roll).localeCompare(String(b.roll))),marks};return C[cid]}
/* save some marks of one document: only the changed rolls are sent, so two teachers do not overwrite each other */
function saveMk(cid,id,head,ch){const D=C[cid],cur=D.marks[id]||{m:{}},m={...(cur.m||{})};
  Object.entries(ch).forEach(([r,v])=>{if(v==null||v==='')delete m[r];else m[r]=v});
  head={...head,by:SJS.user.uid,byName:SJS.me?SJS.me.name:(SJS.user.email||'')};
  const full={...cur,...head,m};delete full.id;D.marks[id]={id,...full};
  if(FB()){const pm={},F=firebase.firestore.FieldValue;Object.entries(ch).forEach(([r,v])=>pm[r]=(v==null||v==='')?F.delete():v);
    return WRITE('c/'+cid+'/marks/'+id,{...head,m:pm,at:F.serverTimestamp()},true)}
  return WRITE('c/'+cid+'/marks/'+id,{...full,at:Date.now()},false)}

/* ---------- class group (scheme), subjects, exam parts ---------- */
function schemeOf(cid){const c=cls(cid),n=nc(c&&c.cls),S=cfg().schemes;let hit=S.find(s=>toks(s.classes).includes(n));
  if(!hit){let best=0;S.forEach(s=>toks(s.classes).forEach(t=>{if(n.startsWith(t)&&!/^[IVX]/.test(n.slice(t.length))&&t.length>best){best=t.length;hit=s}}))}
  return hit||S.find(s=>s.id==='mid')||S[0]}
function parseSubj(str){const seen={};return String(str||'').split(',').map(x=>x.trim()).filter(Boolean).map(raw=>{let name=raw,graded=false,th=null,pr=null;
  const m=name.match(/\[\s*(\d+)\s*\+\s*(\d+)\s*\]/);if(m){th=+m[1];pr=+m[2];name=name.replace(m[0],'').trim()}
  if(/\*$/.test(name)){graded=true;name=name.replace(/\*+$/,'').trim()}return{name,key:skey(name),graded,th,pr}}).filter(s=>s.name&&!seen[s.key]&&(seen[s.key]=1))}
function subjStr(cid){const c=cls(cid),s=cfg().subj||{},k='cls:'+nc(c&&c.cls);if(s[k])return s[k];const o=((OLD&&OLD.subj)||{})[cid];if(o&&o.length)return o.join(', ');return schemeOf(cid).subjects||''}
const subjOf=cid=>parseSubj(subjStr(cid));
/* full marks and weight of one exam part for one subject.  wt 0 = shown on the report card but not counted */
function cdef(c,s){let max=+c.max||0,wt=c.wt==null?max:+c.wt;
  if(c.kind==='T'&&s&&s.th!=null){if(wt===max)wt=s.th;max=s.th}
  if(c.kind==='P'&&s&&s.pr!=null){if(wt===max)wt=s.pr;max=s.pr}
  return{max,wt,na:max<=0}}
const cosAreas=S=>String(S.cos||'').split(',').map(x=>x.trim()).filter(Boolean);
const cosScale=S=>String(S.cosScale||'A, B, C').split(',').map(x=>x.trim()).filter(Boolean);
const xid=(tid,k)=>'x_'+tid+'__'+k;
const viewName=(S,v)=>v==='final'?'Final Result':((S.terms.find(t=>t.id===v)||{}).name||v);

/* ---------- the result calculation ---------- */
function compute(cid,view){const D=C[cid],S=schemeOf(cid),SL=subjOf(cid),pass=+cfg().pass||33;
  const agg=(view==='final'?(S.final==='last'?[S.terms[S.terms.length-1]]:S.terms):S.terms.filter(t=>t.id===view)).map(t=>t.id);
  const rows=D.students.map(st=>{const sub={};let tot=0,full=0,nf=0;const failed=[];
    SL.forEach(s=>{const T={};let g=0,mx=0,has=false,fs=false;
      S.terms.forEach(t=>{let tg=0,tm=0,th=false,tf=false;
        const cells=t.comps.map(c=>{const df=cdef(c,s);if(df.na)return{na:1};const d=D.marks[c.id+'__'+s.key];const v=d&&d.m?d.m[st.roll]:undefined;
          if(v===undefined||v===''||v===null)return{};const em=+(d.max)||df.max;th=true;
          if(v==='AB'){tm+=df.wt;if(c.kind&&df.wt>0&&S.sepPass)tf=true;return{v:'AB',em,sc:0,wt:df.wt}}
          const sc=em?(+v)/em*df.wt:0;tg+=sc;tm+=df.wt;if(c.kind&&df.wt>0&&S.sepPass&&r2((+v)/em*100)<pass)tf=true;return{v:+v,em,sc,wt:df.wt}});
        T[t.id]={cells,got:tg,mx:tm,has:th,p:tm?tg/tm*100:null,failSep:tf};
        if(agg.includes(t.id)&&th){has=true;g+=tg;mx+=tm;if(tf)fs=true}});
      const p=mx?g/mx*100:null,fail=has&&mx>0&&(r2(p)<pass||fs);
      sub[s.key]={T,got:g,mx,p,has,fail,g:grade(p)};
      if(has&&mx>0&&!s.graded){tot+=g;full+=mx;if(fail){nf++;failed.push(s.name)}}});
    const p=full?tot/full*100:null;
    const status=!full?'':nf===0?'PASS':(view==='final'&&nf<=(+cfg().compMax||0))?'COMP':'FAIL';
    return{st,cid,sub,tot,full,p,g:grade(p),nf,failed,status,any:full>0}});
  rankRows(rows);return{S,SL,rows,view}}
function rankRows(rows){rows.forEach(r=>delete r.rank);const pool=rows.filter(r=>r.any&&(!cfg().rankPassOnly||r.status==='PASS')).sort((a,b)=>b.p-a.p);
  let rk=0,last=null;pool.forEach(r=>{const k=r2(r.p);if(k!==last){rk++;last=k}r.rank=rk})}
const termTot=(r,SL,tid)=>{let g=0,m=0;SL.forEach(s=>{const x=r.sub[s.key].T[tid];if(x&&x.has&&x.mx>0&&!s.graded){g+=x.got;m+=x.mx}});return{g,m,p:m?g/m*100:null}};
const stText=(r,fin)=>r.status==='PASS'?(fin?'PASSED':'PASS'):r.status==='COMP'?'COMPARTMENT':r.status==='FAIL'?(fin?'NOT PASSED':'NEEDS IMPROVEMENT'):'';
const stPill=r=>r.status?`<span class="pill ${r.status==='PASS'?'g':r.status==='COMP'?'y':'r'}">${r.status==='PASS'?'Pass':r.status==='COMP'?'Compartment':'Fail'}</span>`:'';
function stats(rows){const a=rows.filter(r=>r.any),p=a.filter(r=>r.status==='PASS'),co=a.filter(r=>r.status==='COMP');
  return{n:rows.length,app:a.length,pass:p.length,comp:co.length,fail:a.length-p.length-co.length,pp:a.length?Math.round(p.length/a.length*100):0,
    avg:a.length?a.reduce((x,r)=>x+r.p,0)/a.length:null,hi:a.length?Math.max(...a.map(r=>r.p)):null}}
function autoRemark(r){if(r.p==null)return'';if(r.status==='FAIL')return'Needs to work much harder. Parents are requested to meet the Class Teacher.';if(r.status==='COMP')return'Must prepare well for the compartment subject(s).';
  if(r.p>=90)return'Outstanding performance. Keep it up!';if(r.p>=75)return'Very good performance. Keep working hard.';if(r.p>=60)return'Good. Can do even better with regular study.';if(r.p>=45)return'Satisfactory. Needs more effort and practice.';return'Passed, but must improve with regular study.'}

/* ---------- page frame ---------- */
function tabs(){const T=[['dash','Dashboard'],['enter','Enter Marks'],['cos','Grades & Remarks'],['res','Results'],['cards','Report Cards']];if(SJS.isAdmin)T.push(['setup','Setup']);
  return `<div class="nav"><div class="nav-in">${T.map(([k,l])=>`<button class="tab ${M.tab===k?'act':''}" data-t="${k}">${l}</button>`).join('')}</div></div>`}
function render(){const a=$('#app');const h=a.querySelector('.hdr').outerHTML;a.innerHTML=h+tabs()+'<main id="main"></main>';
  a.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{if(dirtyN()&&!confirm('Marks not saved. Leave anyway?'))return;clearDirty();M.tab=b.dataset.t;ls('tab',M.tab);render()});
  sync();({dash:vDash,enter:vEnter,cos:vCos,res:vRes,cards:vCards,setup:vSetup}[M.tab]||vDash)($('#main')).catch(e=>{console.error(e);$('#main').innerHTML='<div class="card empty">Could not open this class. If you are offline, open this class once with the internet on, then it will also work offline.</div>'})}
const clearDirty=()=>{M.dirty={};M.maxd={};M.cos=null};
const sel=(id,label,opts,val)=>`<label class="f">${label}<select class="inp" id="${id}">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;
function classSel(){const cs=SJS.classes;return sel('cSel','Class',cs.map(c=>[c.id,classLabel(c)+(SJS.canClass(c.id)&&!SJS.isAdmin?' ★':'')]),M.cid)}
function viewSel(S,id='vSel',label='Result for'){return sel(id,label,[...S.terms.map(t=>[t.id,t.name]),['final','Final Result (whole year)']],M.view)}
function pick(){const cs=SJS.classes;if(!cs.length){M.cid=null;return false}
  if(!M.cid||!cls(M.cid)){const mine=SJS.myClasses()[0],sv=lg('cid');M.cid=sv&&cls(sv)?sv:(mine||cs[0]).id}
  const S=schemeOf(M.cid);if(M.view!=='final'&&!S.terms.some(t=>t.id===M.view))M.view=S.terms[0].id;if(!S.terms.some(t=>t.id===M.term))M.term=S.terms[0].id;return true}
const noClass='<div class="banner warn">No classes yet. The Admin adds classes and students in SJS App → Student Attendance. The same students appear here.</div>';
function guard(e,prop){if(dirtyN()&&!confirm('Marks not saved. Leave anyway?')){e.target.value=M[prop];return false}clearDirty();return true}
function wire(m,again){const c=$('#cSel');if(c)c.onchange=e=>{if(!guard(e,'cid'))return;M.cid=e.target.value;ls('cid',M.cid);again(m)};
  const v=$('#vSel');if(v)v.onchange=e=>{M.view=e.target.value;ls('view',M.view);again(m)}}

/* ---------- Dashboard ---------- */
async function vDash(m){if(!pick()){m.innerHTML=noClass;return}m.innerHTML='<div class="empty">Loading…</div>';const D=await load(M.cid);
  const R=compute(M.cid,M.view),{S,SL}=R,st=stats(R.rows),c=cls(M.cid);
  const terms=M.view==='final'?S.terms:S.terms.filter(t=>t.id===M.view);
  const prog=SL.map(s=>({s,cells:terms.flatMap(t=>t.comps.map(cp=>{if(cdef(cp,s).na)return null;const d=D.marks[cp.id+'__'+s.key];const n=d&&d.m?D.students.filter(x=>d.m[x.roll]!==undefined&&d.m[x.roll]!=='').length:0;return{n,by:d&&d.byName}}))}));
  const cols=terms.flatMap(t=>t.comps.map(cp=>({t,cp})));
  const gd=cfg().grades.slice().sort((a,b)=>b.min-a.min).map(g=>({g:g.g,n:R.rows.filter(r=>r.any&&r.g===g.g).length}));const gmax=Math.max(1,...gd.map(x=>x.n));
  const sa=SL.map(s=>{const v=R.rows.map(r=>r.sub[s.key]).filter(x=>x.has&&x.mx>0);return{s,avg:v.length?v.reduce((a,b)=>a+b.p,0)/v.length:null,n:v.length}});
  m.innerHTML=`<div class="card"><div class="grid2">${classSel()}${viewSel(S)}</div><div class="tmeta" style="margin-top:8px">${esc(S.name)} · ${S.terms.map(t=>esc(t.name)+': '+t.comps.map(x=>esc(x.name)).join(' + ')).join(' &nbsp;|&nbsp; ')}</div></div>

async function vCards(m){if(!pick()){m.innerHTML=noClass;return}m.innerHTML='<div class="empty">Loading…</div>';const D=await load(M.cid);
  const S=schemeOf(M.cid),c=cls(M.cid),R=compute(M.cid,M.view),fin=M.view==='final';const O=M.co=M.co||{date:SJS.todayISO(),rank:true,chart:true};
  m.innerHTML=`<div class="card"><div class="grid2">${classSel()}${viewSel(S,'vSel','Report card for')}<label class="f">Date on the card<input class="inp" id="oDate" type="date" value="${esc(O.date||'')}"></label>
    ${fin?`<label class="f">Promoted to Class<input class="inp" id="oPromo" value="${esc(O.promo!==undefined?O.promo:nextCls(c))}"></label><label class="f">School reopens on<input class="inp" id="oRe" type="date" value="${esc(O.reopen||'')}"></label>`:''}</div>
    <div class="row" style="margin-top:10px"><label class="pill" style="padding:6px 10px"><input type="checkbox" id="oRank" ${O.rank?'checked':''}> Show rank</label><label class="pill" style="padding:6px 10px"><input type="checkbox" id="oChart" ${O.chart?'checked':''}> Show chart</label><div class="grow"></div><button class="btn pri" id="rcAll">🖨 Print all ${D.students.length} report cards</button></div>
    <p class="sub" style="margin:8px 0 0">A4 portrait, one page for each student. In the print window choose “Save as PDF” to keep a copy. Attendance, co-scholastic grades and remarks come from <b>Grades &amp; Remarks</b>.</p></div>
   <div class="card"><h3>One student</h3>${R.rows.map((r,i)=>`<div class="li"><span class="pill">${esc(r.st.roll)}</span><span class="grow"><b>${esc(r.st.name)}</b><div class="tmeta">${r.any?fmt(r.p)+'% · '+r.g+(r.rank?' · Rank '+r.rank:''):'No marks yet'}</div></span>${stPill(r)}${r.any&&waPhone(r.st.phone)?`<button class="btn sm green" data-wa="${i}">WhatsApp</button>`:''}<button class="btn sm" data-one="${i}">Print</button></div>`).join('')||'<div class="empty">No students.</div>'}</div>`;
  wire(m,vCards);const opt=()=>{O.date=$('#oDate').value;O.rank=$('#oRank').checked;O.chart=$('#oChart').checked;if(fin){O.promo=$('#oPromo').value.trim();O.reopen=$('#oRe').value}return{view:M.view,date:O.date,rank:O.rank,chart:O.chart,promo:fin?O.promo:'',reopen:fin?O.reopen:''}};
  const go=list=>{const o=opt();printDoc('Report Cards – '+classLabel(c),'portrait',list.map((r,i)=>`<div class="${i<list.length-1?'pb':''}">${cardHTML(M.cid,R,r,o)}</div>`).join(''))};
  $('#rcAll').onclick=()=>go(R.rows);m.querySelectorAll('[data-one]').forEach(b=>b.onclick=()=>go([R.rows[+b.dataset.one]]));
  m.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{const r=R.rows[+b.dataset.wa];window.open('https://wa.me/'+waPhone(r.st.phone)+'?text='+encodeURIComponent(waText(M.cid,R,r,M.view)),'_blank')})}

/* ---------- Setup (Admin) ---------- */
const compStr=t=>t.comps.map(c=>c.name+'='+c.max+(c.wt!=null&&+c.wt!==+c.max?'>'+c.wt:'')+(c.kind?' '+c.kind:'')).join(', ');
function parseComps(str,old,tix){const used={};const list=String(str||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const q=x.match(/^(.*?)=\s*(\d+(?:\.\d+)?)\s*(?:>\s*(\d+(?:\.\d+)?))?\s*([TPtp])?$/);if(!q)return null;
    const o={name:q[1].trim(),max:+q[2]};if(q[3]!==undefined)o.wt=+q[3];if(q[4])o.kind=q[4].toUpperCase();return o.name?o:null}).filter(Boolean);
  list.forEach((c,i)=>{let id=old.length===list.length?old[i].id:(old.find(o=>o.name.toLowerCase()===c.name.toLowerCase())||{}).id;if(!id||used[id])id=('c'+(tix+1)+skey(c.name).toLowerCase()).slice(0,12);while(used[id])id+='x';used[id]=1;c.id=id});return list}
async function vSetup(m){const c=JSON.parse(JSON.stringify(cfg())),sc=c.school;const seenCls={};const clsList=SJS.classes.filter(k=>{const n=nc(k.cls);if(seenCls[n])return false;seenCls[n]=1;return true});
  const lockIds=[];c.schemes.forEach(s=>s.terms.forEach(t=>{t.comps.forEach(cp=>{if(!lockIds.some(x=>x[0]===cp.id))lockIds.push([cp.id,cp.name])});if(!lockIds.some(x=>x[0]==='x_'+t.id))lockIds.push(['x_'+t.id,t.name+' – grades & remarks'])}));
  m.innerHTML=`<div class="card"><h2>School details</h2><p class="sub">Printed at the top of every report card and result sheet. The school name and session come from SJS App settings.</p>
    <div class="grid2">${[['motto','Motto'],['address','Address'],['affil','CBSE Affiliation No.'],['code','School Code'],['udise','UDISE Code'],['email','Email']].map(([k,l])=>`<label class="f">${l}<input class="inp" data-sc="${k}" value="${esc(sc[k]||'')}"></label>`).join('')}</div></div>
  <div class="card"><h2>Pass mark, grades and rank</h2><div class="grid2"><label class="f">Pass mark in each subject (%)<input class="inp" id="pass" type="number" value="${c.pass}"></label>
    <label class="f">Compartment allowed in up to (subjects)<input class="inp" id="cmx" type="number" min="0" value="${c.compMax}"></label>
    ${sel('rpo','Rank is given to',[['1','Passed students only'],['0','All students']],c.rankPassOnly?'1':'0')}
    <label class="f">Grades (grade=minimum %)<input class="inp" id="grd" value="${esc([...c.grades].sort((a,b)=>b.min-a.min).map(g=>g.g+'='+g.min).join(', '))}"></label></div></div>
  <div class="card"><h2>Class groups and exams</h2><p class="sub">Each group has its own terms and exams. Write each exam as <b>Name=full marks</b>, separated by commas.<br>
    <b>PT-I=25&gt;10</b> means the test is out of 25 and counts as 10. <b>&gt;0</b> means shown on the report card but not counted. Add <b>T</b> (theory) or <b>P</b> (practical) for Class XI–XII.<br>Rename freely, but do not remove an exam that already has marks.</p>
    ${c.schemes.map((s,i)=>`<details class="grp" ${i===0?'':''}><summary>${esc(s.name)} <span class="tmeta">· ${esc(s.classes)}</span></summary><div class="grid2" style="margin-top:8px"><label class="f">Group name<input class="inp" data-g="${i}" data-k="name" value="${esc(s.name)}"></label><label class="f">Classes in this group<input class="inp" data-g="${i}" data-k="classes" value="${esc(s.classes)}"></label></div>
      ${s.terms.map((t,j)=>`<div class="grid2" style="margin-top:8px"><label class="f" style="flex:0 0 120px">Term ${j+1} name<input class="inp" data-g="${i}" data-tn="${j}" value="${esc(t.name)}"></label><label class="f" style="grid-column:span 2">Exams in ${esc(t.name)}<input class="inp" data-g="${i}" data-tc="${j}" value="${esc(compStr(t))}"></label></div>`).join('')}
      <div class="grid2" style="margin-top:8px">${sel('fin'+i,'Final result is from',[['avg','All terms together'],['last','The last term only']],s.final)}${sel('sep'+i,'Theory & practical',[['0','Pass on the subject total'],['1','Must pass each separately']],s.sepPass?'1':'0')}
      <label class="f">Co-scholastic grades<input class="inp" data-g="${i}" data-k="cosScale" value="${esc(s.cosScale)}"></label></div>
      <label class="f" style="margin-top:8px">Co-scholastic areas<input class="inp" data-g="${i}" data-k="cos" value="${esc(s.cos)}"></label>
      <label class="f" style="margin-top:8px">Usual subjects of this group<input class="inp" data-g="${i}" data-k="subjects" value="${esc(s.subjects)}"></label></details>`).join('')}</div>
  <div class="card"><h2>Subjects for each class</h2><p class="sub">Comma separated, in report-card order. Leave empty to use the group's usual subjects. <b>Drawing*</b> = grade only (not counted in the total). <b>Physics [70+30]</b> = theory 70 + practical 30. In Class XI–XII list every subject offered – a student's subjects are the ones that have marks.</p>
    ${clsList.map(k=>{const key='cls:'+nc(k.cls);const leg=((OLD&&OLD.subj)||{})[k.id];return `<label class="f" style="margin-bottom:8px">Class ${esc(k.cls)} <span class="tmeta">${esc(schemeOf(k.id).name)}</span><input class="inp" data-cs="${esc(key)}" value="${esc((c.subj||{})[key]||(leg&&leg.length?leg.join(', '):''))}" placeholder="${esc(schemeOf(k.id).subjects)}"></label>`}).join('')||'<div class="empty">No classes yet.</div>'}</div>
  <div class="card"><h2>🔒 Lock exams</h2><p class="sub">Lock an exam when its result is final. After that only the Admin can change those marks.</p><div class="row">${lockIds.map(([id,n])=>`<label class="pill" style="padding:6px 10px"><input type="checkbox" data-lk="${esc(id)}" ${locked(id)?'checked':''}> ${esc(n)}</label>`).join('')}</div></div>
  <div class="row"><button class="btn danger" id="rst">Back to CBSE defaults</button><div class="grow"></div><button class="btn pri" id="svSet">Save setup</button></div>`;
  $('#rst').onclick=()=>{if(confirm('Put the class groups, exams and grades back to the CBSE defaults? Marks already entered are not deleted.')){const x=JSON.parse(JSON.stringify(DEF));x.subj=c.subj||{};x.school=sc;CFG=x;WRITE('mk_cfg/cbse',x,false);toast('Defaults restored');vSetup(m)}};
  $('#svSet').onclick=async()=>{const x=c;m.querySelectorAll('[data-sc]').forEach(i=>x.school[i.dataset.sc]=i.value.trim());
    x.pass=+$('#pass').value||33;x.compMax=+$('#cmx').value||0;x.rankPassOnly=$('#rpo').value==='1';
    const gs=$('#grd').value.split(',').map(t=>t.split('=')).filter(p=>p.length===2&&p[0].trim()&&!isNaN(+p[1])).map(p=>({g:p[0].trim(),min:+p[1]}));if(gs.length)x.grades=gs;
    let err='';x.schemes.forEach((s,i)=>{m.querySelectorAll(`[data-g="${i}"][data-k]`).forEach(inp=>s[inp.dataset.k]=inp.value.trim());s.final=$('#fin'+i).value;s.sepPass=$('#sep'+i).value==='1';
      s.terms.forEach((t,j)=>{t.name=m.querySelector(`[data-g="${i}"][data-tn="${j}"]`).value.trim()||t.name;const list=parseComps(m.querySelector(`[data-g="${i}"][data-tc="${j}"]`).value,t.comps,j);if(!list.length)err=s.name+' – '+t.name;else t.comps=list})});
    if(err){toast('Check the exams of '+err+' – write them like PT-I=10, Half Yearly=80');return}
    x.subj={};m.querySelectorAll('[data-cs]').forEach(i=>{const v=i.value.trim();if(v)x.subj[i.dataset.cs]=v});
    const lk={};m.querySelectorAll('[data-lk]').forEach(k=>lk[k.dataset.lk]=k.checked);
    CFG=x;OLD={...(OLD||{}),locked:lk};
    await Promise.all([WRITE('mk_cfg/cbse',x,false),WRITE('mk_cfg/main',{locked:lk},true)]);toast('Setup saved');vSetup(m)}}

/* ---------- demo data (marks.html?demo=1) ---------- */
window.SJS_DEMO_SEED=D=>{const names=['Lalremruata','Vanlalhriati','Zothanpuii','Lalrinfela','Malsawmtluanga','Lalnunsiami','Rohmingthanga','Biakchungnunga','Laldinpuii','Joseph Lalhmangaiha','Lalthanpuii','Ramdinsanga'];
  const cl=[['nur-a','Nursery','A',1],['iii-a','III','A',2],['vi-a','VI','A',3],['vi-b','VI','B',4],['x-a','X','A',5],['xii-a','XII','A',6]];
  cl.forEach(([id,c,s,o],ci)=>{D['classes/'+id]={id,cls:c,section:s,order:o,teacherUids:['demo-admin']};names.forEach((n,i)=>{D[`c/${id}/students/${i+1}`]={roll:i+1,name:n,adm:'SJS/'+(2400+ci*20+i),father:'Pu '+n.split(' ')[0]+'a',mother:'Pi '+n.slice(0,5)+'i',dob:'20'+(22-ci*2)+'-0'+(1+i%9)+'-1'+(i%9),blood:['A+','B+','O+','AB+'][i%4],phone:'98620'+String(10000+i)}})});
  D['att_teachers/t1']={name:'Sir Lalkunga Molsom',uid:'demo-admin',ttc:'LK',order:1};
  const put=(cid,ex,subj,max,f)=>{const m={};names.forEach((n,i)=>{const v=f(i);if(v!==null)m[i+1]=v});D[`c/${cid}/marks/${ex}__${skey(subj)}`]={exam:ex,subj,max,m,byName:'Sir Lalkunga Molsom'}};
  const sc=(max,i,j,k)=>(i===3&&j===2&&k===3)?'AB':Math.max(1,Math.round(max*(0.34+((i*7+j*5+k*3)%11)/16)));
  const P=s=>parseSubj(s).map(x=>x.name);const G=id=>DEF.schemes.find(s=>s.id===id);
  [['nur-a','pp',2],['iii-a','pri',2],['vi-a','mid',2],['vi-b','mid',1],['x-a','sec',1]].forEach(([cid,g,nt])=>{const S=G(g);P(S.subjects).forEach((s,j)=>S.terms.slice(0,nt).forEach((t,ti)=>t.comps.forEach((c,k)=>put(cid,c.id,s,c.max,i=>(cid==='vi-a'&&i===7&&j<3)?Math.round(c.max*0.22):sc(c.max,i+ti,j,k)))))});
  const sr=parseSubj(G('sr').subjects),sci=['English Core','Physics','Chemistry','Biology','Mathematics'],arts=['English Core','History','Political Science','Geography','Economics'];
  sr.forEach((s,j)=>G('sr').terms[0].comps.forEach((c,k)=>{const df=c.kind==='T'&&s.th!=null?s.th:c.kind==='P'&&s.pr!=null?s.pr:c.max;put('xii-a',c.id,s.name,df,i=>((i<6?sci:arts).includes(s.name))?sc(df,i,j,k):null)}));
  ['vi-a','x-a'].forEach(cid=>{const m={},r={};names.forEach((n,i)=>{m[i+1]=96+((i*5)%14)});D[`c/${cid}/marks/x_t1__att`]={exam:'x_t1',subj:'att',max:110,m};
    cosAreas(G('mid')).forEach((a,j)=>{const g={};names.forEach((n,i)=>g[i+1]=['A','A','B','A','C'][(i+j)%5]);D[`c/${cid}/marks/x_t1__c${skey(a).slice(0,19)}`]={exam:'x_t1',subj:'cos:'+a,m:g}})})};

SJS.boot('Result Software',async()=>{M.tab=lg('tab')||'dash';if(M.tab==='setup'&&!SJS.isAdmin)M.tab='dash';M.view=lg('view')||'t1';
  let n=0;const go=()=>{if(++n<2)return;if(n===2||!dirtyN())render()};
  SJS.db.watch('mk_cfg/cbse',d=>{if(d){const x=JSON.parse(JSON.stringify(DEF));Object.keys(d).forEach(k=>{if(k==='school')Object.assign(x.school,d.school||{});else x[k]=d[k]});CFG=x}else CFG=null;go()});
  SJS.db.watch('mk_cfg/main',d=>{OLD=d||{};go()})});
</script>
