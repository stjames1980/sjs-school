<!DOCTYPE html>
<html lang="en">

<link rel="stylesheet" href="sjs-common.css">
<style>
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:12px}
.k{border-radius:14px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#13294b,#2a4f8f);box-shadow:0 6px 16px rgba(19,41,75,.14)}
.k b{display:block;font-size:24px;font-weight:800;line-height:1.15}.k span{font-size:10.5px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.k.g{background:linear-gradient(135deg,#0b6b3a,#1aa35c)}.k.r{background:linear-gradient(135deg,#9a2323,#d84848)}.k.y{background:linear-gradient(135deg,#9a7412,#d4ab2c)}.k.p{background:linear-gradient(135deg,#4a2a8a,#7c56c8)}
.bar{height:9px;border-radius:99px;background:#edf0f5;overflow:hidden;flex:1 1 80px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1d3d6e,#3f73c4)}
.bar.g i{background:linear-gradient(90deg,#0b6b3a,#22b866)}.bar.r i{background:linear-gradient(90deg,#b62d2d,#e26a6a)}.bar.y i{background:linear-gradient(90deg,#b98a12,#e5c04a)}
.gdist{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:16px}.gdist div{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.gdist i{display:block;background:linear-gradient(180deg,#3f73c4,#13294b);border-radius:6px 6px 0 0;min-height:2px}.gdist em{font-style:normal;color:var(--navy);font-size:12px}
.et th,.et td{padding:5px 4px;text-align:center}.et td.nm,.et th.nm{text-align:left;position:sticky;left:0;background:#fff;z-index:1;max-width:128px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et th.nm{background:#f8f9fb}.et .mk{width:56px}.et th .mx{width:52px;padding:3px;text-align:center;font-weight:700;margin-top:3px}
.et td.tt{font-weight:800;color:var(--navy)}
.pg{font-size:11px;font-weight:700;border-radius:8px;padding:3px 6px;display:inline-block;min-width:46px;text-align:center}
.pg.z{background:#f1f3f7;color:#8a93a3}.pg.h{background:var(--warnbg);color:#6b4b00}.pg.f{background:var(--goodbg);color:#075f07}
#sync{position:fixed;left:10px;bottom:18px;z-index:90;font:700 11.5px/1 system-ui,sans-serif;padding:9px 12px;border-radius:99px;background:#e4f6e4;color:#075f07;box-shadow:0 4px 14px rgba(0,0,0,.14)}
#sync.off{background:#fff3d6;color:#6b4b00}#sync.p{background:#e3eefb;color:#174d8f}
.stu{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}.stu .h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}.cg label{font-size:11px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.cg .inp{padding:6px 8px}
.red{color:var(--crit);font-weight:700}
details.grp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}details.grp summary{font-weight:700;color:var(--navy);cursor:pointer}
@media(max-width:480px){.et td.nm,.et th.nm{max-width:92px}.et .mk{width:42px;padding:7px 2px}.et th{font-size:9.5px}.et th .mx{width:40px}.et td,.et th{padding:4px 2px}}
@media print{#sync{display:none!important}}
</style>

<body>
<script src="config.js"></script>
<script src="sjs-common.js"></script>
<script>
/* ===== SJS Result Software (CBSE pattern, Nursery – XII) =====
   Works online and offline: marks are saved on the phone first and upload by themselves when the internet returns.
   mk_cfg/cbse   class groups (terms, exams, weights), subjects, grades, school details          (Admin)
   mk_cfg/main   locked:{examId:true}  – a locked exam can be changed only by the Admin              (Admin)
   c/<classId>/marks/<examId>__<subject>   {exam, subj, max, m:{roll: mark or "AB"}, by, byName, at}
   c/<classId>/marks/x_<termId>__att | __rem | __c<Area>   attendance, remarks, co-scholastic grades for a term */
const {$,esc,toast,sheet,closeSheet,pasteRows,classLabel,waPhone}=SJS;
const VER='44';
const ROM=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
const CBSE_T=(n,pt,ex,exn)=>({id:'t'+n,name:'Term '+n,comps:[{id:'pt'+n,name:pt,max:10},{id:'nb'+n,name:'Note Book',max:5},{id:'se'+n,name:'SEA',max:5},{id:ex,name:exn,max:80}]});
const DEF={
  school:{issued:'(Issued by school as per directives of Central Board of Secondary Education, Delhi)',motto:'Faith And Service',address:'Gongrai, PO. Kendraicherra, Dist-Sepahijala, Tripura-799102',affil:'2030038',code:'35414',udise:'16050401504',email:'stjames579@gmail.com'},
  pass:33,minAtt:75,compMax:2,compMode:'sp',abRule:'zero',scText:'Considered on Special Consideration',rankPassOnly:true,
  grades:[{min:91,g:'A1'},{min:81,g:'A2'},{min:71,g:'B1'},{min:61,g:'B2'},{min:51,g:'C1'},{min:41,g:'C2'},{min:33,g:'D'},{min:0,g:'E'}],
  schemes:[
   {id:'nur',name:'Nursery',classes:'Nursery',final:'last',sepPass:false,card:'first',grades:'A+=90, A=75, B=56, C=33, D=0',cosScale:'★★★, ★★, ★',
    cos:'Language & Communication: Listens and follows instructions, Speaks clearly in short sentences, Recognises letters and sounds, Traces and writes letters; Numbers & Thinking: Counts and recognises 1 – 20, Knows shapes and colours, Sorts and matches objects, Completes simple patterns; Creative & Physical: Enjoys drawing and colouring, Sings rhymes with actions, Holds pencil and crayon correctly, Runs jumps and balances; Personal & Social: Shares and plays with friends, Follows class routine, Keeps self and things tidy, Greets and says thank you',
    subjects:'English, Mathematics, Drawing',terms:[{id:'fx',name:'Final Examination',comps:[{id:'nfx',name:'Final Exam',max:30}]}]},
   {id:'pp',name:'Pre-Primary (KG)',classes:'LKG, UKG, KG, KG-I, KG-II',final:'avg',sepPass:false,grades:'A+=90, A=75, B=56, C=33, D=0',cos:'Conversation, Rhymes & Recitation, Drawing & Colouring, Handwriting, Games, Discipline',cosScale:'A, B, C',
    subjects:'English {Written 30, Reading 10, Dictation 10}, Rhymes {Recitation 30, Singing 20}, Mathematics {Written 30, Oral 20}, Drawing {Written 30, Creativity 10, Skill 10}',
    terms:[{id:'t1',name:'Term 1',comps:[{id:'pt1',name:'P.Test-I',max:50},{id:'hy',name:'Half Yearly',max:50}]},{id:'t2',name:'Term 2',comps:[{id:'pt2',name:'P.Test-II',max:50},{id:'an',name:'Annual',max:50}]}]},
   {id:'pri',name:'Primary (Class I – V)',classes:'I, II, III, IV, V',final:'avg',sepPass:false,cos:'Work Education, Art Education, Health & Physical Education, Discipline',cosScale:'A, B, C',
    subjects:'English, Hindi, Mizo/Bengali, Mathematics, EVS, Computer, G.K.*, Drawing*',terms:[CBSE_T(1,'PT-I','hy','Half Yearly'),CBSE_T(2,'PT-II','an','Annual')]},
   {id:'mid',name:'Middle (Class VI – VIII)',classes:'VI, VII, VIII',final:'avg',sepPass:false,cos:'Work Education, Art Education, Health & Physical Education, Discipline',cosScale:'A, B, C',
    subjects:'English, Hindi, Mizo/Bengali, Mathematics, Science, Social Science, Computer',terms:[CBSE_T(1,'PT-I','hy','Half Yearly'),CBSE_T(2,'PT-II','an','Annual')]},
   {id:'sec',name:'Secondary (Class IX – X)',classes:'IX, X',final:'avg',sepPass:false,cos:'Work Education, Art Education, Health & Physical Education, Discipline',cosScale:'A, B, C, D, E',
    subjects:'English, Hindi/Mizo/Bengali, Mathematics, Science, Social Science, Information Technology',terms:[CBSE_T(1,'PT-I','hy','Half Yearly'),CBSE_T(2,'PT-II','an','Annual'),{id:'pb',name:'Pre-Board Examination',solo:true,cls:'X',card:'x',comps:[{id:'pbt',name:'Theory',max:80},{id:'pbi',name:'Internal',max:20}]}]},
   {id:'sr',name:'Senior Secondary (Class XI – XII)',classes:'XI, XII',final:'avg',sepPass:true,cos:'Work Experience, Health & Physical Education, General Studies, Discipline',cosScale:'A, B, C, D, E',
    subjects:'English Core, Physics [70+30], Chemistry [70+30], Biology [70+30], Mathematics, Computer Science [70+30], Physical Education [70+30], History, Political Science, Geography [70+30], Economics, Accountancy, Business Studies',
    terms:[{id:'t1',name:'Term 1',comps:[{id:'pt1',name:'PT-I',max:25,wt:0},{id:'hy',name:'Half Yearly Theory',max:80,kind:'T'},{id:'hyp',name:'Practical / IA',max:20,kind:'P'}]},
           {id:'t2',name:'Term 2',comps:[{id:'pt2',name:'PT-II',max:25,wt:0},{id:'an',name:'Annual Theory',max:80,kind:'T'},{id:'anp',name:'Practical / IA',max:20,kind:'P'}]},
           {id:'pb',name:'Pre-Board Examination',solo:true,cls:'XII',card:'xii',comps:[{id:'pbt',name:'Theory',max:80,kind:'T'},{id:'pbi',name:'Internal / Practical',max:20,kind:'P'}]}]}],
  subj:{}};
let CFG=null,OLD=null;                       // mk_cfg/cbse , mk_cfg/main
const C={};                                  // class data cache: cid -> {students, marks}
const M={tab:'dash',order:'roll',cid:null,view:'t1',term:'t1',subj:null,comp:'all',dirty:{},maxd:{},scope:'sec',cos:null,school:null};
const LSK='sjs-res-';const lg=k=>{try{return localStorage.getItem(LSK+k)}catch(e){return null}};const ls=(k,v)=>{try{localStorage.setItem(LSK+k,v)}catch(e){}};
const cfg=()=>CFG||DEF;
const locked=id=>!!((OLD&&OLD.locked)||{})[id];
const cls=cid=>SJS.classes.find(c=>c.id===cid);
const skey=s=>String(s).replace(/[^A-Za-z0-9]/g,'').slice(0,20)||'S';
const nc=s=>{let t=String(s||'').toUpperCase().replace(/CLASS|STD|[^A-Z0-9]/g,'');if(/^\d+$/.test(t)&&+t>=1&&+t<=12)t=ROM[+t];return t};
const toks=s=>String(s||'').split(',').map(nc).filter(Boolean);
const r2=x=>Math.round(x*100)/100;
const fmt=v=>v==null||v===''?'':v==='AB'?'AB':String(Math.round(v*10)/10);
const gradesOf=S=>{const g=S&&S.grades?String(S.grades).split(',').map(t=>t.split('=')).filter(q=>q.length===2&&q[0].trim()&&!isNaN(+q[1])).map(q=>({g:q[0].trim(),min:+q[1]})):[];return(g.length?g:cfg().grades).slice().sort((a,b)=>b.min-a.min)};
const grade=(p,S)=>{if(p==null)return'';const x=Math.round(p);const g=gradesOf(S).find(q=>x>=q.min);return g?g.g:''};
const dirtyN=()=>Object.keys(M.dirty).length+Object.keys(M.maxd).length+(M.cos?1:0);
const FB=()=>!!(window.firebase&&firebase.apps&&firebase.apps.length);

/* ---------- data: works from the phone's saved copy when there is no internet ---------- */
async function LIST(c){if(!FB())return SJS.db.list(c);const q=firebase.firestore().collection(c);let s;
  try{s=navigator.onLine?await q.get():await q.get({source:'cache'})}catch(e){s=await q.get({source:'cache'})}
  return s.docs.map(d=>({id:d.id,...d.data()}))}
let PEND=0,RULEERR=false;
const RULEMSG='<b>The database is refusing the Result Software.</b> The Firestore rules published on Firebase are older than this app, so setup and marks cannot be saved. Fix (Admin, once): open <b>console.firebase.google.com</b> → your project → <b>Firestore Database → Rules</b>, delete everything there, paste the whole of the file <b>firestore.rules</b> from GitHub, and tap <b>Publish</b>. Then reload this page.';
const realSet=(path,data,merge)=>FB()?firebase.firestore().doc(path).set(data,merge?{merge:true}:{}):SJS.db.set(path,data,merge);
function sync(){let el=$('#sync');if(!el){el=document.createElement('div');el.id='sync';document.body.appendChild(el)}const on=navigator.onLine;
  el.className=PEND?'p':on?'':'off';el.textContent=PEND?(on?'⟳ Saving…':'● Offline · '+PEND+' saved on this phone'):(on?'● Online · all saved':'● Offline · you can keep working')}
function WRITE(path,data,merge){const p=FB()?firebase.firestore().doc(path).set(data,merge?{merge:true}:{}):SJS.db.set(path,data,merge);
  PEND++;sync();const done=()=>{PEND=Math.max(0,PEND-1);sync()};
  p.then(done,e=>{done();if(e&&e.code==='permission-denied'&&/^mk_cfg\//.test(path)){RULEERR=true}toast(e&&e.code==='permission-denied'?'Not allowed – this exam is locked, or the Admin has not confirmed you':'A save did not go through – please try again')});
  return navigator.onLine?Promise.race([p.catch(()=>{}),new Promise(r=>setTimeout(r,4000))]):Promise.resolve()}
window.addEventListener('online',sync);window.addEventListener('offline',sync);
async function load(cid,force){if(C[cid]&&!force)return C[cid];const [st,mk]=await Promise.all([LIST('c/'+cid+'/students'),LIST('c/'+cid+'/marks')]);
  const marks={};mk.forEach(d=>marks[d.id]=d);C[cid]={students:st.sort((a,b)=>(+a.roll||0)-(+b.roll||0)||String(a.roll).localeCompare(String(b.roll))),marks};return C[cid]}
/* save some marks of one document: only the changed rolls are sent, so two teachers do not overwrite each other */
function saveMk(cid,id,head,ch){const D=C[cid],cur=D.marks[id]||{m:{}},m={...(cur.m||{})};
  Object.entries(ch).forEach(([r,v])=>{if(v==null||v==='')delete m[r];else m[r]=v});
  head={...head,by:SJS.user.uid,byName:SJS.me?SJS.me.name:(SJS.user.email||'')};
  const full={...cur,...head,m};delete full.id;D.marks[id]={id,...full};
  if(FB()){const pm={},F=firebase.firestore.FieldValue;Object.entries(ch).forEach(([r,v])=>pm[r]=(v==null||v==='')?F.delete():v);
    return WRITE('c/'+cid+'/marks/'+id,{...head,m:pm,at:F.serverTimestamp()},true)}
  return WRITE('c/'+cid+'/marks/'+id,{...full,at:Date.now()},false)}

/* ---------- class group (scheme), subjects, exam parts ---------- */
function schemeOf(cid){const c=cls(cid),n=nc(c&&c.cls),S=cfg().schemes;let hit=S.find(s=>toks(s.classes).includes(n));
  if(!hit){let best=0;S.forEach(s=>toks(s.classes).forEach(t=>{if(n.startsWith(t)&&!/^[IVX]/.test(n.slice(t.length))&&t.length>best){best=t.length;hit=s}}))}
  hit=hit||S.find(s=>s.id==='mid')||S[0];
  return hit.terms.some(t=>t.cls)?{...hit,terms:hit.terms.filter(t=>!t.cls||toks(t.cls).includes(n))}:hit}
const mainT=S=>{const a=S.terms.filter(t=>!t.solo);return a.length?a:S.terms};
const splitTop=str=>{const out=[];let d=0,cur='';for(const ch of String(str||'')){if(ch==='{'||ch==='[')d++;if(ch==='}'||ch===']')d=Math.max(0,d-1);if(ch===','&&!d){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim()).filter(Boolean)};
/* "Drawing*" = grade only · "Physics [70+30]" = theory + practical · "English {Written 30, Reading 10, Dictation 10}" = aspects with their full marks in each exam */
function parseSubj(str){const seen={};return splitTop(str).map(raw=>{let name=raw,graded=false,th=null,pr=null,asp=null;
  const b=name.match(/\{([^}]*)\}/);if(b){name=name.replace(b[0],'').trim();asp=b[1].split(',').map(x=>{const q=x.trim().match(/^(.*?)[\s=:]+(\d+(?:\.\d+)?)$/);return q&&q[1].trim()?{name:q[1].trim(),max:+q[2]}:null}).filter(Boolean);if(!asp.length)asp=null}
  const m=name.match(/\[\s*(\d+)\s*\+\s*(\d+)\s*\]/);if(m){th=+m[1];pr=+m[2];name=name.replace(m[0],'').trim()}
  if(/\*$/.test(name)){graded=true;name=name.replace(/\*+$/,'').trim()}
  if(asp)asp.forEach(q=>q.key=skey(name).slice(0,11)+skey(q.name).slice(0,9));return{name,key:skey(name),graded,th,pr,asp}}).filter(q=>q.name&&!seen[q.key]&&(seen[q.key]=1))}
/* marks of one student in one exam of one subject (aspects are added up) */
function rawOf(D,c,s,roll,df){if(!s.asp){const d=D.marks[c.id+'__'+s.key];return[d&&d.m?d.m[roll]:undefined,+(d&&d.max)||df.max,null]}
  let sum=0,em=0,any=false,allAB=true;const parts=s.asp.map(q=>{const d=D.marks[c.id+'__'+q.key],v=d&&d.m?d.m[roll]:undefined,mx=+(d&&d.max)||q.max;em+=mx;if(v!==undefined&&v!==null&&v!==''){any=true;if(v!=='AB'){allAB=false;sum+=+v}}return{v,em:mx}});
  return[any?(allAB?'AB':sum):undefined,em,parts]}
const filledN=(D,cp,s)=>{const ds=(s.asp?s.asp.map(q=>D.marks[cp.id+'__'+q.key]):[D.marks[cp.id+'__'+s.key]]).filter(d=>d&&d.m);return{n:D.students.filter(x=>ds.some(d=>d.m[x.roll]!==undefined&&d.m[x.roll]!=='')).length,by:(ds[0]||{}).byName}};
function subjStr(cid){const c=cls(cid),s=cfg().subj||{},k='cls:'+nc(c&&c.cls);if(s[k])return s[k];const o=((OLD&&OLD.subj)||{})[cid];if(o&&o.length)return o.join(', ');return schemeOf(cid).subjects||''}
const subjOf=cid=>parseSubj(subjStr(cid));
/* full marks and weight of one exam part for one subject.  wt 0 = shown on the report card but not counted */
function cdef(c,s){let max=+c.max||0,wt=c.wt==null?max:+c.wt;
  if(c.kind==='T'&&s&&s.th!=null){if(wt===max)wt=s.th;max=s.th}
  if(c.kind==='P'&&s&&s.pr!=null){if(wt===max)wt=s.pr;max=s.pr}
  return{max,wt,na:max<=0}}
const cardOf=S=>S.card||(['pp','pri'].includes(S.id)?'jr':'std');
const stars=p=>{if(p==null)return'';const n=p>=91?5:p>=75?4:p>=60?3:p>=45?2:1;return'★'.repeat(n)+'☆'.repeat(5-n)};
const cosAreas=S=>skillGroups(S).flatMap(g=>g.items);
const cosScale=S=>String(S.cosScale||'A, B, C').split(',').map(x=>x.trim()).filter(Boolean);
const xid=(tid,k)=>'x_'+tid+'__'+k;
const compOfView=(S,v)=>{if(String(v).slice(0,2)!=='c:')return null;for(const t of S.terms){const c=t.comps.find(q=>q.id===v.slice(2));if(c)return{t,c}}return null};
const validView=(S,v)=>(v==='final'||S.terms.some(t=>t.id===v)||compOfView(S,v))?v:S.terms[0].id;
const viewTerms=(S,v)=>{const cv=compOfView(S,v);return v==='final'?mainT(S):cv?[cv.t]:S.terms.filter(t=>t.id===v)};
const viewName=(S,v)=>{const cv=compOfView(S,v);return v==='final'?'Final Result':cv?cv.c.name+(S.terms.length>1?' ('+cv.t.name+')':''):((S.terms.find(t=>t.id===v)||{}).name||v)};

/* ---------- the result calculation ---------- */
const gkey=s=>'x_fin__g'+s.key.slice(0,18);const rvOf=(D,k,roll)=>{const d=D.marks['x_fin__'+k];const v=d&&d.m?d.m[roll]:'';return v==null?'':v};
function compute(cid,view){const isFin=view==='final',D=C[cid],isTerm=schemeOf(cid).terms.some(t=>t.id===view),S=schemeOf(cid),SL=subjOf(cid),pass=+cfg().pass||33,cm=compOfView(S,view);
  const MT=mainT(S),agg=(view==='final'?(S.final==='last'?[MT[MT.length-1]]:MT):S.terms.filter(t=>t.id===view)).map(t=>t.id);
  const eq=view==='final'&&S.final!=='last'&&MT.length>1,share=100/MT.length;   // Final = Term 1 50% + Term 2 50% (out of 100)
  const rows=D.students.map(st=>{const sub={};let tot=0,full=0,nf=0;const failed=[],absent=[];
    SL.forEach(s=>{const T={};let g=0,mx=0,has=false,fs=false,sab=false;const isAB=q=>q&&(q.v==='AB'||(q.parts||[]).some(z=>z.v==='AB'));
      S.terms.forEach(t=>{let tg=0,tm=0,th=false,tf=false;
        const cells=t.comps.map(c=>{const df=cdef(c,s);if(df.na)return{na:1};const [v,em,parts]=rawOf(D,c,s,st.roll,df);
          if(v===undefined||v===''||v===null)return{em,wt:df.wt,parts};th=true;
          if(v==='AB'){tm+=df.wt;if(c.kind&&df.wt>0&&S.sepPass)tf=true;return{v:'AB',em,sc:0,wt:df.wt,parts}}
          const sc=em?(+v)/em*df.wt:0;tg+=sc;tm+=df.wt;if(c.kind&&df.wt>0&&S.sepPass&&r2((+v)/em*100)<pass)tf=true;return{v:+v,em,sc,wt:df.wt,parts}});
        T[t.id]={cells,got:tg,mx:tm,has:th,p:tm?tg/tm*100:null,failSep:tf};
        if(agg.includes(t.id)&&(!isFin||t===MT[MT.length-1])&&cells.some(q=>q.wt>0&&isAB(q)))sab=true;   // in the Final Result only an absence in the last term counts
        if(agg.includes(t.id)&&th){has=true;if(eq){if(tm>0){g+=tg/tm*share;mx+=share}}else{g+=tg;mx+=tm}if(tf)fs=true}});
      if(cm){const q=T[cm.t.id].cells[cm.t.comps.indexOf(cm.c)];if(q&&q.v!==undefined){has=true;g=q.v==='AB'?0:q.v;mx=q.em}sab=isAB(q)}   // one exam only: raw marks
      let grace=0;if(isFin&&has&&mx>0){const gd=D.marks[gkey(s)],gv=gd&&gd.m?+gd.m[st.roll]||0:0;if(gv>0){grace=Math.min(gv,mx-g);g+=grace}}   // grace marks given at the result review
      const p=mx?g/mx*100:null,fail=has&&mx>0&&(r2(p)<pass||(fs&&!grace));
      sub[s.key]={T,got:g,mx,p,has,fail,grace,g:grade(p,S)};
      if(sab&&has&&!s.graded)absent.push(s.name);
