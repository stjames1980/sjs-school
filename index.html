<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SJS School – St. James H.S. School</title>
<meta name="theme-color" content="#13294b">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SJS School">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --navy:#13294b; --navy2:#1d3d6e; --gold:#c9a227; --gold2:#f3e4ad;
  --bg:#f4f5f8; --card:#ffffff; --ink:#18202e; --ink2:#4a5568; --muted:#7a8496;
  --line:#e3e6ec; --line2:#cfd4dd;
  --good:#0ca30c; --goodbg:#e4f6e4; --crit:#d03b3b; --critbg:#fbe6e6;
  --warn:#fab219; --warnbg:#fff3d6; --ser:#ec835a; --serbg:#fdece4;
  --od:#2a78d6; --odbg:#e3eefb; --leave:#7b5cc4; --leavebg:#eee8fa;
  --bar:#3b6fd6;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}

/* Header */
.hdr{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:18px 16px 14px;position:relative;overflow:hidden}
.hdr:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(201,162,39,.16)}
.hdr-in{max-width:1180px;margin:0 auto;display:flex;gap:14px;align-items:center;position:relative;z-index:1}
.crest{flex:none;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e7a8,var(--gold));color:var(--navy);display:grid;place-items:center;font-family:Merriweather,serif;font-weight:900;font-size:19px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.sname{font-family:Merriweather,serif;font-weight:900;font-size:20px;letter-spacing:.5px;margin:0}
.motto{color:var(--gold2);font-style:italic;font-size:12.5px;margin-top:1px}
.addr{font-size:11.5px;opacity:.82;margin-top:3px}
.hdr-right{margin-left:auto;text-align:right;flex:none}
.sess{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;font-weight:600;font-size:12px}
.mode{display:block;margin-top:6px;font-size:11px;opacity:.85}
.mode i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0;background:#aaa}
.mode.on i{background:#3ddc6b}.mode.local i{background:var(--warn)}
.title-strip{max-width:1180px;margin:10px auto 0;position:relative;z-index:1;font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold2)}
@media (max-width:640px){.hdr-in{flex-wrap:wrap}.hdr-right{margin-left:0;text-align:left;width:100%}.sname{font-size:17px}.crest{width:46px;height:46px;font-size:16px}}

/* Nav */
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(19,41,75,.05)}
.nav-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab:hover{background:#eef1f6}
.tab.act{background:var(--navy);color:#fff}

main{max-width:1180px;margin:0 auto;padding:16px 12px 110px}
.banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.info{background:#e8f0fd;color:#183a72}
.banner.warn{background:var(--warnbg);color:#6b4b00}
.banner.err{background:var(--critbg);color:#7c1d1d}
.banner b{font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h2{margin:0 0 4px;font-size:16px;font-weight:800;color:var(--navy)}
.card h3{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--navy)}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.btn{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){background:#f3f5f9}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--navy2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.danger{color:var(--crit);border-color:#efc2c2}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.inp,select.inp,textarea.inp{border:1px solid var(--line2);border-radius:10px;padding:8px 11px;background:#fff;min-width:0}
.inp:focus{outline:2px solid #9db8ea;outline-offset:0;border-color:#6d93dd}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

/* Date bar */
.datebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.datebar .day{font-weight:800;font-size:17px;color:var(--navy)}
.datebar .dow{color:var(--muted);font-weight:600}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-size:16px;font-weight:700;display:grid;place-items:center}

/* Status chips */
.st{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 8px;border-radius:8px;font-weight:700;font-size:12px;border:1.5px solid var(--line2);background:#fff;color:var(--ink2)}
.st.on.P{background:var(--good);border-color:var(--good);color:#fff}
.st.on.L{background:var(--ser);border-color:var(--ser);color:#fff}
.st.on.HD{background:var(--warn);border-color:var(--warn);color:#0b0b0b}
.st.on.OD{background:var(--od);border-color:var(--od);color:#fff}
.st.on.CL,.st.on.ML{background:var(--leave);border-color:var(--leave);color:#fff}
.st.on.A{background:var(--crit);border-color:var(--crit);color:#fff}
.code{display:inline-block;min-width:26px;text-align:center;font-weight:700;font-size:11px;border-radius:6px;padding:2px 4px}
.code.P{background:var(--goodbg);color:#075f07}
.code.L{background:var(--serbg);color:#8a3a17}
.code.HD{background:var(--warnbg);color:#6b4b00}
.code.OD{background:var(--odbg);color:#174d8f}
.code.CL,.code.ML{background:var(--leavebg);color:#4c338a}
.code.A{background:var(--critbg);color:#8f1f1f}
.code.off{background:#eceef2;color:#8a93a3}

.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cnt{display:inline-flex;gap:6px;align-items:center;background:#f6f7fa;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink2)}
.cnt b{color:var(--ink)}

/* Teacher rows */
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(180px,1.2fr) auto minmax(170px,1fr);gap:10px;align-items:center}
.trow.dirty{border-color:#9db8ea;box-shadow:0 0 0 2px #e3ecfb}
.tname{font-weight:700}
.tmeta{font-size:12px;color:var(--muted)}
.tno{display:inline-block;font-size:11px;font-weight:700;color:var(--navy);background:var(--gold2);border-radius:6px;padding:1px 6px;margin-right:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.extra{display:flex;gap:6px}
.extra .inp{padding:6px 8px;font-size:12.5px}
.extra .t{width:96px;flex:none}
.extra .r{flex:1}
@media (max-width:820px){.trow{grid-template-columns:1fr}}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:center}
.savebar-in{max-width:1180px;width:100%;display:flex;gap:10px;align-items:center}
.savebar .msg{font-size:12.5px;color:var(--ink2)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--navy))}
.kpi .l{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--ink2)}

/* Chart */
.chart{position:relative;height:200px;margin-top:6px}
.plot{position:absolute;left:34px;right:0;top:6px;bottom:24px;border-bottom:1px solid #c3c2b7;display:flex;align-items:flex-end;gap:2px}
.gl{position:absolute;left:34px;right:0;border-top:1px solid #e9e8e2;font-size:10.5px;color:var(--muted)}
.gl span{position:absolute;left:-34px;top:-8px;width:28px;text-align:right}
.bcol{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;min-width:6px}
.bcol:hover{background:rgba(59,111,214,.06)}
.bfill{width:100%;max-width:28px;margin:0 auto;background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.bcol.none .bfill{background:#e1e0d9}
.blab{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.tip{position:absolute;pointer-events:none;background:#18202e;color:#fff;font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);z-index:5;display:none}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.li:last-child{border-bottom:0}
.empty{color:var(--muted);font-size:13px;padding:8px 0}

/* Tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh}
table.reg{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.reg th,.reg td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 4px;text-align:center;white-space:nowrap;background:#fff}
.reg thead th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;font-weight:600;font-size:11px}
.reg thead th.offh{background:#4b5d7d}
.reg td.offd{background:#f1f2f5}
.reg .stk{position:sticky;left:0;z-index:1;text-align:left;min-width:150px;font-weight:600}
.reg thead .stk{z-index:3}
.reg td.tot{font-weight:700;background:#fafbfd}
.reg tfoot td{font-weight:700;background:#f6f7fa}
.reg .pct{font-weight:800}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* Teachers admin */
.tcard{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tcard:last-child{border-bottom:0}
.tcard.inactive{opacity:.55}
.pill{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:#eef1f6;color:var(--ink2)}
.hol{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:10px;padding:6px 10px;font-size:13px;background:#fff}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,20,40,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#18202e;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:20px}
.hidden{display:none!important}

.mecard{border-top:4px solid var(--gold)}
.bigstate{border-radius:12px;padding:14px;font-size:15px;font-weight:600}
.bigstate.ok{background:var(--goodbg);color:#075f07}
.bigstate.late{background:var(--serbg);color:#8a3a17}
.bigstate.abs{background:var(--critbg);color:#8f1f1f}
.bigstate.wait{background:#eef3fc;color:#183a72}
.bigstate.off{background:#f1f2f5;color:#4a5568}
.bigbtn{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;padding:18px;font-size:20px;font-weight:800;letter-spacing:.5px;color:#fff;background:linear-gradient(135deg,#0ca30c,#087a08);box-shadow:0 6px 18px rgba(12,163,12,.3)}
.bigbtn:active{transform:scale(.98)}
.nav.hidden{display:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:112px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.tile:active{transform:scale(.98)}
.tile .ti{font-size:26px;line-height:1}
.tile .tt{font-weight:800;color:var(--navy);font-size:14.5px;margin-top:4px}
.tile .ts{font-size:12px;color:var(--muted)}
.tile.hot{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold2)}
.tile.hot .ts{color:#8a6400;font-weight:600}
.tile.locked{opacity:.6}
h3.sec{margin:18px 2px 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.notice{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.notice.pin{border-color:var(--gold);background:#fffbef}
.nbody{white-space:pre-wrap;font-size:13.5px;color:var(--ink2)}
.crestimg{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;object-fit:contain;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
@media (max-width:640px){.crestimg{width:46px;height:46px}}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-in">
    <img class="crestimg" alt="" src="logo.png">
    <div>
      <h1 class="sname" id="hSchool">ST. JAMES H.S. SCHOOL</h1>
      <div class="motto" id="hMotto">Faith And Service</div>
      <div class="addr" id="hAddr"></div>
    </div>
    <div class="hdr-right">
      <span class="sess" id="hSess">Session</span>
      <span class="mode" id="hMode"><i></i>Connecting…</span>
    </div>
  </div>
  <div class="title-strip" id="hTitle">SJS School App</div>
</header>
<nav class="nav hidden"><div class="nav-in" id="nav"></div></nav>
<main id="main"><div class="banner info">Loading…</div></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
/* =========================================================
   SJS Teacher Attendance – St. James H.S. School
   Each teacher marks only their own attendance. The time is
   taken from Google's server (not the phone), and nobody can
   change or delete a mark once saved (see firestore.rules).
   ========================================================= */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEFAULT_CFG={
  school:'ST. JAMES H.S. SCHOOL', motto:'Faith And Service',
  address:'Gongrai, PO. Kendraicherra, Dist-Sepahijala, Tripura-799102', principal:'',
  session:'2026-27', start:'2026-03', end:'2027-04', trackFrom:'2026-11-03',
  offSun:true, offSatAll:false, offSats:[], holidays:[],
  mOpen:'06:00', mLate:'07:15', mClose:'10:00', nOpen:'10:00', nLate:'11:15', nClose:'13:30',
  leaveTypes:[
    {code:'CL',name:'Casual Leave',quota:12,present:false},
    {code:'ML',name:'Medical Leave',quota:10,present:false},
    {code:'OD',name:'On Duty',quota:0,present:true}
  ]
};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
/* All dates and times in India time, whatever the phone's setting */
const IST=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
function istParts(d){ const o={}; IST.formatToParts(d).forEach(p=>o[p.type]=p.value); return {date:o.year+'-'+o.month+'-'+o.day, hm:o.hour+':'+o.minute}; }
const todayISO=()=>istParts(new Date()).date;
const nowHM=()=>istParts(new Date()).hm;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fmtDate=s=>{const d=parse(s);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)+' '+d.getFullYear();};
const monthLabel=ym=>{const[y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+y;};
const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();};
const pct=(a,b)=>b?Math.round(a*1000/b)/10:0;
const newId=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const okHM=v=>/^\d\d:\d\d$/.test(v||'');

const S={cfg:{...DEFAULT_CFG},teachers:[],links:{},marks:{},leaves:{},dec:{},notices:{},noticeErr:false,user:null,isAdmin:false,myLink:null,
  view:'home',date:todayISO(),regMonth:null,repTeacher:null,busy:false,ready:false,err:''};
let fs=null, auth=null, FV=null;

/* ================= Calendar ================= */
const sessionStart=()=>S.cfg.start+'-01';
const sessionEnd=()=>S.cfg.end+'-'+pad(daysIn(S.cfg.end));
function sessionMonths(){const o=[];let[y,m]=S.cfg.start.split('-').map(Number);const[ey,em]=S.cfg.end.split('-').map(Number);let g=0;while((y<ey||(y===ey&&m<=em))&&g++<36){o.push(y+'-'+pad(m));m++;if(m>12){m=1;y++;}}return o;}
const inSession=ds=>ds>=sessionStart()&&ds<=sessionEnd();
function offReason(ds){
  for(const h of (S.cfg.holidays||[])) if(ds>=h.from&&ds<=(h.to||h.from)) return h.name||'Holiday';
  const d=parse(ds),w=d.getDay();
  if(w===0&&S.cfg.offSun) return 'Sunday';
  if(w===6){ if(S.cfg.offSatAll) return 'Saturday'; const n=Math.ceil(d.getDate()/7); if((S.cfg.offSats||[]).includes(n)) return ['','1st','2nd','3rd','4th','5th'][n]+' Saturday'; }
  return null;
}
const monthDates=ym=>{const n=daysIn(ym),o=[];for(let i=1;i<=n;i++)o.push(ym+'-'+pad(i));return o;};
const countable=ds=>inSession(ds)&&ds>=(S.cfg.trackFrom||sessionStart())&&!offReason(ds)&&ds<=todayISO();
const shiftTimes=sh=>sh==='Noon'?{open:S.cfg.nOpen,late:S.cfg.nLate,close:S.cfg.nClose}:{open:S.cfg.mOpen,late:S.cfg.mLate,close:S.cfg.mClose};
const activeTeachers=()=>S.teachers.filter(t=>t.active!==false);
const sortT=l=>[...l].sort((a,b)=>(a.order??9999)-(b.order??9999)||String(a.name).localeCompare(String(b.name)));
const markOf=(uid,ds)=>uid?S.marks[ds+'_'+uid]||null:null;
/* ---- Leave / On duty ---- */
const LT=()=>(S.cfg.leaveTypes&&S.cfg.leaveTypes.length?S.cfg.leaveTypes:DEFAULT_CFG.leaveTypes);
const ltOf=code=>LT().find(x=>x.code===code)||{code,name:code,quota:0,present:false};
const leaveState=id=>{const d=S.dec[id];return !d?'pending':d.ok?'approved':'rejected';};
function leaveOn(uid,ds){ if(!uid) return null; for(const [id,l] of Object.entries(S.leaves)){ if(l.uid===uid&&ds>=l.from&&ds<=l.to&&leaveState(id)==='approved') return l.type; } return null; }
const isLeaveCode=s=>!!s&&!['P','L','A','W','H',''].includes(s);
/* 'P' present, 'L' late, 'A' absent, 'W' today & still open, 'H' holiday, CL/ML/OD… approved leave, '' not counted */
function statusOf(t,ds){
  if(!inSession(ds)) return ''; if(offReason(ds)) return 'H';
  if(ds<(S.cfg.trackFrom||sessionStart())) return '';
  const lv=leaveOn(t.uid,ds);
  if(ds>todayISO()) return lv||'';
  const st=shiftTimes(t.shift), m=markOf(t.uid,ds);
  if(m&&m.hm&&m.hm<=st.close) return m.hm>st.late?'L':'P';
  if(lv) return lv;
  if(m&&m.hm) return 'A';
  if(ds===todayISO()&&nowHM()<=st.close) return 'W';
  return 'A';
}
/* % = days present (P + L + duty types) ÷ working days, not counting approved leave days */
function tally(t,dates){
  const c={P:0,L:0,A:0,days:0,lv:{},onLeave:0,duty:0};
  dates.forEach(ds=>{ if(ds>todayISO()) return; const s=statusOf(t,ds);
    if(s==='P'||s==='L'||s==='A'){c[s]++;c.days++;}
    else if(isLeaveCode(s)){ c.lv[s]=(c.lv[s]||0)+1; c.days++; if(ltOf(s).present) c.duty++; else c.onLeave++; } });
  c.present=c.P+c.L+c.duty; c.pct=pct(c.present,c.days-c.onLeave); return c;
}
/* Working days a leave uses (for balances) */
function leaveDaysUsed(uid,code){ let n=0; Object.entries(S.leaves).forEach(([id,l])=>{ if(l.uid!==uid||l.type!==code||leaveState(id)!=='approved') return;
  for(let d=parse(l.from);iso2(d)<=l.to;d.setDate(d.getDate()+1)){ const ds=iso2(d); if(inSession(ds)&&!offReason(ds)) n++; } }); return n; }
const iso2=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const workDaysBetween=(a,b)=>{let n=0;for(let d=parse(a);iso2(d)<=b;d.setDate(d.getDate()+1)){const ds=iso2(d);if(inSession(ds)&&!offReason(ds))n++;}return n;};
const badge=s=>s==='W'?'<span class="code off">Open</span>':s==='H'?'<span class="code off">H</span>':isLeaveCode(s)?`<span class="code ${ltOf(s).present?'OD':'CL'}" title="${esc(ltOf(s).name)}">${esc(s)}</span>`:s?`<span class="code ${s}">${s}</span>`:'';

/* ================= Firebase ================= */
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});}
function markFromDoc(d){ const x=d.data(); const at=x.at&&x.at.toDate?x.at.toDate():null; return {uid:x.uid,date:x.date,r:x.r||'',hm:at?istParts(at).hm:'',pending:!at}; }
let unsubs=[], monthUnsub=null, monthKey='';
async function start(){
  const cfg=window.SJS_FIREBASE;
  if(!cfg||!cfg.apiKey){ S.err='Online settings (config.js) are missing.'; render(); return; }
  try{
    const b='https://www.gstatic.com/firebasejs/10.12.2/';
    await loadScript(b+'firebase-app-compat.js'); await loadScript(b+'firebase-auth-compat.js'); await loadScript(b+'firebase-firestore-compat.js');
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    auth=firebase.auth(); fs=firebase.firestore(); FV=firebase.firestore.FieldValue;
    try{ await fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
  }catch(e){ S.err='Could not load. Check the internet connection and open the app again.'; render(); return; }
  auth.onAuthStateChanged(async u=>{
    unsubs.forEach(f=>f()); unsubs=[]; if(monthUnsub){monthUnsub();monthUnsub=null;monthKey='';}
    S.view='home'; S.user=u; S.isAdmin=false; S.myLink=null; S.marks={}; S.links={}; S.leaves={}; S.dec={}; S.notices={}; S.noticeErr=false; S.ready=false;
    if(!u){ render(); return; }
    render();
    try{ await fs.collection('att_links').limit(1).get(); S.isAdmin=true; }catch(e){ S.isAdmin=false; }
    const err=e=>{ if(e&&e.code==='permission-denied') toast('Permission problem – ask the Admin to check the Firestore rules.'); else toast('Connection problem: '+(e&&e.code||'')); };
    unsubs.push(fs.doc('att_config/settings').onSnapshot(s=>{S.cfg=s.exists?{...DEFAULT_CFG,...s.data()}:{...DEFAULT_CFG};render();},err));
    unsubs.push(fs.collection('att_teachers').onSnapshot(s=>{S.teachers=s.docs.map(d=>({id:d.id,...d.data()}));render();},err));
    if(S.isAdmin){
      unsubs.push(fs.collection('att_links').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.links=m;S.myLink=m[u.uid]||null;render();},err));
    } else {
      unsubs.push(fs.doc('att_links/'+u.uid).onSnapshot(s=>{S.myLink=s.exists?s.data():null;render();},err));
    }
    unsubs.push(fs.collection('att_notices').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.notices=m;S.noticeErr=false;render();},()=>{S.noticeErr=true;render();}));
    const lq=c=>S.isAdmin?fs.collection(c):fs.collection(c).where('uid','==',u.uid);
    unsubs.push(lq('att_leaves').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.leaves=m;render();},err));
    unsubs.push(lq('att_leave_ok').onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.dec=m;render();},err));
    unsubs.push(fs.collection('att_marks').where('uid','==',u.uid).onSnapshot(s=>{s.docs.forEach(d=>S.marks[d.id]=markFromDoc(d));S.ready=true;render();},err));
    if(S.isAdmin) watchMonth(todayISO().slice(0,7));
  });
}
/* Admin: live marks for one month at a time (keeps reads small) */
function watchMonth(ym){
  if(!S.isAdmin||monthKey===ym) return; if(monthUnsub) monthUnsub(); monthKey=ym;
  monthUnsub=fs.collection('att_marks').where('date','>=',ym+'-01').where('date','<=',ym+'-31').onSnapshot(s=>{
    s.docChanges().forEach(c=>{ if(c.type==='removed') delete S.marks[c.doc.id]; else S.marks[c.doc.id]=markFromDoc(c.doc); }); render();
  },e=>toast('Could not load marks ('+(e.code||'')+')'));
}
async function loadRange(from,to){ const s=await fs.collection('att_marks').where('date','>=',from).where('date','<=',to).get(); s.docs.forEach(d=>S.marks[d.id]=markFromDoc(d)); }
async function loadTeacherMarks(uid){ if(!uid) return; const s=await fs.collection('att_marks').where('uid','==',uid).get(); s.docs.forEach(d=>S.marks[d.id]=markFromDoc(d)); }

function fbErr(e){
  const c=(e&&e.code||'').replace('auth/','');
  const msg={'permission-denied':'Not allowed. If this is your attendance: check that your phone\'s date is correct and that today is a school day.','invalid-credential':'Wrong email or password.','wrong-password':'Wrong email or password.','user-not-found':'No account with this email.','email-already-in-use':'This email already has an account – use Sign in.','weak-password':'Password must be at least 6 characters.','invalid-email':'Please enter a correct email.','network-request-failed':'No internet connection.','too-many-requests':'Too many tries – wait a few minutes.','unavailable':'No internet connection.'}[c];
  toast(msg||('Error: '+(c||'unknown')));
}

/* ================= MY ATTENDANCE ================= */
function vMe(){
  const ts=sortT(activeTeachers()); const link=S.myLink; const t=link&&S.teachers.find(x=>x.id===link.teacherId);
  if(!t){
    if(!ts.length) return '<div class="card"><h2>Teacher list is empty</h2><p class="sub">The Admin has not added the teachers yet. Please check again later.</p></div>';
    return `<div class="card mecard"><h2>Choose your name (one time)</h2><p class="sub">The Admin will confirm it. After that only you can mark your attendance.</p>
      <div class="row"><select class="inp grow" id="pickT"><option value="">— Select your name —</option>${ts.map(x=>`<option value="${x.id}">${esc(x.name)}${x.subject?' ('+esc(x.subject)+')':''}</option>`).join('')}</select><button class="btn pri" id="pickB">This is me</button></div></div>`;
  }
  const linked=t.uid===S.user.uid, ds=todayISO(), off=offReason(ds), st=shiftTimes(t.shift), now=nowHM();
  const m=markOf(S.user.uid,ds);
  let state,btn=false;
  if(!S.ready) state='<div class="bigstate wait">Loading…</div>';
  else if(!inSession(ds)) state=`<div class="bigstate off">Today is outside the session (${monthLabel(S.cfg.start)} – ${monthLabel(S.cfg.end)}).</div>`;
  else if(off) state=`<div class="bigstate off">🎉 Holiday today – ${esc(off)}</div>`;
  else if(!m&&leaveOn(S.user.uid,ds)) state=`<div class="bigstate wait">Today: <b>${esc(ltOf(leaveOn(S.user.uid,ds)).name)}</b> (approved by Admin)</div>`;
  else if(m&&m.pending) state='<div class="bigstate wait">Saving… keep the internet on.</div>';
  else if(m) { const s=m.hm>st.close?'A':m.hm>st.late?'L':'P'; state=`<div class="bigstate ${s==='P'?'ok':s==='L'?'late':'abs'}">${s==='A'?'✗':'✓'} Marked at <b>${esc(m.hm)}</b> – ${s==='P'?'PRESENT':s==='L'?'LATE':'after closing time: ABSENT'}</div>`; }
  else if(now<st.open) state=`<div class="bigstate wait">Attendance opens at <b>${esc(st.open)}</b></div>`;
  else if(now>st.close) state=`<div class="bigstate abs">✗ Closed at ${esc(st.close)}. Today is recorded as <b>ABSENT</b>.</div>`;

  if(t.uid&&!loadedT[t.uid]){ loadedT[t.uid]=1; loadTeacherMarks(t.uid).then(render).catch(fbErr); }
  const rows=sessionMonths().map(m=>({m,c:tally(t,monthDates(m))})); const T={P:0,L:0,A:0,days:0,present:0,onLeave:0,lv:{}}; rows.forEach(r=>{['P','L','A','days','present','onLeave'].forEach(k=>T[k]+=r.c[k]);LT().forEach(x=>T.lv[x.code]=(T.lv[x.code]||0)+(r.c.lv[x.code]||0));});
  const notes=[]; sessionMonths().forEach(m=>monthDates(m).forEach(d=>{const s=statusOf(t,d),mk=markOf(t.uid,d);if(s==='A'||s==='L'||isLeaveCode(s)||(mk&&mk.r))notes.push({d,s,mk});}));
  return `<div class="card"><div class="row"><div class="grow"><h2>Teacher Report</h2><p class="sub" style="margin:0">Session ${esc(S.cfg.session)}</p></div><select class="inp" id="repT">${ts.map(x=>`<option value="${x.id}" ${x.id===t.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></div>
  <div class="kpis"><div class="kpi"><div class="l">Teacher</div><div class="v" style="font-size:17px">${esc(t.name)}</div><div class="s">${t.uid?'Linked ✓':'Not linked yet'}</div></div>
    <div class="kpi" style="--k:var(--good)"><div class="l">Attendance</div><div class="v">${pct(T.present,T.days-T.onLeave)}%</div><div class="s">${T.days} working day(s)</div></div>
    <div class="kpi" style="--k:var(--ser)"><div class="l">Late</div><div class="v">${T.L}</div></div><div class="kpi" style="--k:var(--crit)"><div class="l">Absent</div><div class="v">${T.A}</div></div>${LT().filter(x=>+x.quota>0).map(x=>`<div class="kpi" style="--k:var(--leave)"><div class="l">${esc(x.code)} balance</div><div class="v">${(+x.quota)-leaveDaysUsed(t.uid,x.code)}</div><div class="s">used ${leaveDaysUsed(t.uid,x.code)} of ${+x.quota}</div></div>`).join('')}</div>
  <div class="card"><h3>Month-wise</h3><div class="tw"><table class="reg"><thead><tr><th class="stk">Month</th><th>P</th><th>L</th>${LT().map(x=>`<th>${esc(x.code)}</th>`).join('')}<th>A</th><th>Days</th><th>%</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="stk">${monthLabel(r.m)}</td><td>${r.c.P}</td><td>${r.c.L}</td>${LT().map(x=>`<td>${r.c.lv[x.code]||''}</td>`).join('')}<td>${r.c.A}</td><td>${r.c.days}</td><td class="pct">${r.c.days?r.c.pct+'%':'–'}</td></tr>`).join('')}</tbody><tfoot><tr><td class="stk">Total</td><td>${T.P}</td><td>${T.L}</td>${LT().map(x=>`<td>${T.lv[x.code]}</td>`).join('')}<td>${T.A}</td><td>${T.days}</td><td>${pct(T.present,T.days-T.onLeave)}%</td></tr></tfoot></table></div></div>
  <div class="card"><h3>Absent, late, leave &amp; remarks</h3>${notes.length?notes.reverse().map(n=>`<div class="li"><span>${fmtDate(n.d)} <span class="tmeta">${DOW[parse(n.d).getDay()]}${n.mk&&n.mk.hm?' · '+esc(n.mk.hm):''}${n.mk&&n.mk.r?' · '+esc(n.mk.r):''}</span></span>${badge(n.s)}</div>`).join(''):'<div class="empty">Nothing to show.</div>'}</div>`;
}
function bRep(){const s=$('#repT');if(s)s.onchange=e=>{S.repTeacher=e.target.value;render();};}

/* ================= ADMIN: TEACHERS ================= */
const ordOf=(code,f)=>{const n=parseFloat(String(code||'').replace(/[^\d.]/g,''));return isNaN(n)?f:n;};
const saveT=(id,t)=>fs.collection('att_teachers').doc(id).set(t);
function vTeach(){
  const ts=sortT(S.teachers);
  const reqs=Object.entries(S.links).filter(([uid,l])=>l&&S.teachers.some(t=>t.id===l.teacherId&&t.uid!==uid));
  return `<div class="card"><h2>Confirm teachers (${reqs.length})</h2><p class="sub">A teacher who signed up and chose a name appears here. Confirm only if the email really belongs to that teacher.</p>
    ${reqs.length?reqs.map(([uid,l])=>{const t=S.teachers.find(x=>x.id===l.teacherId);return `<div class="tcard"><div class="grow"><div class="tname">${esc(l.email||'(no email)')} → <u>${esc(t.name)}</u></div><div class="tmeta">${t.uid?'⚠ already linked to another email – confirming replaces it':'new'}</div></div><button class="btn sm pri" data-ok="${esc(uid)}">Confirm</button></div>`;}).join(''):'<div class="empty">No requests waiting.</div>'}</div>
  <div class="card"><h2>Add a teacher</h2><div class="grid2"><label class="f">Sl. No.<input class="inp" id="nCode" placeholder="01"></label><label class="f">Name *<input class="inp" id="nName"></label><label class="f">Designation<input class="inp" id="nDesig" placeholder="PGT / TGT / PRT"></label><label class="f">Subject<input class="inp" id="nSub"></label><label class="f">Shift<select class="inp" id="nShift"><option>Morning</option><option>Noon</option></select></label></div>
    <div class="row" style="margin-top:12px"><button class="btn pri" id="addT">+ Add Teacher</button><button class="btn" id="bulkT">Paste a list</button></div></div>
  <div class="card"><h2>Teachers (${ts.length})</h2>${ts.length?ts.map(t=>`<div class="tcard ${t.active===false?'inactive':''}"><div class="grow"><div class="tname">${t.code?`<span class="tno">${esc(t.code)}</span>`:''}${esc(t.name)}</div><div class="tmeta">${esc([t.desig,t.subject,t.shift||'Morning',t.email].filter(Boolean).join(' · '))}</div></div><span class="pill" style="${t.uid?'background:var(--goodbg);color:#075f07':''}">${t.uid?'Linked ✓':'Not linked'}</span><button class="btn sm" data-edit="${t.id}">Edit</button></div>`).join(''):'<div class="empty">No teachers yet.</div>'}</div>`;
}
function bTeach(){
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{ const uid=b.dataset.ok,l=S.links[uid],t=S.teachers.find(x=>x.id===l.teacherId); b.disabled=true;
    try{ const batch=fs.batch(); S.teachers.filter(x=>x.uid===uid&&x.id!==t.id).forEach(x=>{const {id,...r}=x;delete r.uid;delete r.email;batch.set(fs.collection('att_teachers').doc(x.id),r);});
      const {id,...rest}=t; batch.set(fs.collection('att_teachers').doc(t.id),{...rest,uid,email:l.email||''}); batch.set(fs.doc('att_staff/'+uid),{teacherId:t.id,email:l.email||''}); await batch.commit(); toast(t.name+' confirmed'); }catch(e){fbErr(e);} });
  $('#addT').onclick=async()=>{const name=$('#nName').value.trim();if(!name){toast('Enter the name');return;}const code=$('#nCode').value.trim();
    try{await saveT(newId(),{code,name,desig:$('#nDesig').value.trim(),subject:$('#nSub').value.trim(),shift:$('#nShift').value,active:true,order:ordOf(code,S.teachers.length+1)});toast(name+' added');}catch(e){fbErr(e);}};
  $('#bulkT').onclick=()=>{modal(`<h3>Paste a list of teachers</h3><p class="sub">One per line: <b>Name, Designation, Subject, Shift</b> (Morning/Noon). Only the name is required. You can copy columns from Excel.</p><textarea class="inp" id="bt" rows="9" style="width:100%"></textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" id="mC">Cancel</button><button class="btn pri" id="mO">Add all</button></div>`);
    $('#mC').onclick=closeModal;$('#mO').onclick=async()=>{const lines=$('#bt').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return;$('#mO').disabled=true;const base=S.teachers.length;
      try{const batch=fs.batch();lines.slice(0,400).forEach((l,i)=>{const p=l.split(/\t|,/).map(x=>x.trim());batch.set(fs.collection('att_teachers').doc(newId()+i),{code:pad(base+i+1),name:p[0],desig:p[1]||'',subject:p[2]||'',shift:(p[3]||'').toLowerCase()==='noon'?'Noon':'Morning',active:true,order:base+i+1});});await batch.commit();closeModal();toast(lines.length+' teacher(s) added');}catch(e){closeModal();fbErr(e);}};};
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const t=S.teachers.find(x=>x.id===b.dataset.edit);
    modal(`<h3>Edit teacher</h3><div class="grid2"><label class="f">Sl. No.<input class="inp" id="eCode" value="${esc(t.code||'')}"></label><label class="f">Name<input class="inp" id="eName" value="${esc(t.name)}"></label><label class="f">Designation<input class="inp" id="eDesig" value="${esc(t.desig||'')}"></label><label class="f">Subject<input class="inp" id="eSub" value="${esc(t.subject||'')}"></label><label class="f">Shift<select class="inp" id="eShift">${['Morning','Noon'].map(s=>`<option ${t.shift===s?'selected':''}>${s}</option>`).join('')}</select></label></div>
      <label class="chk" style="margin-top:10px"><input type="checkbox" id="eAct" ${t.active!==false?'checked':''}> Active</label>${t.uid?`<label class="chk" style="margin-top:10px"><input type="checkbox" id="eUn"> Remove the email link (${esc(t.email||'')})</label>`:''}
      <div class="row" style="margin-top:14px"><button class="btn danger" id="mD">Delete</button><div class="grow"></div><button class="btn" id="mC">Cancel</button><button class="btn pri" id="mO">Save</button></div>`);
    $('#mC').onclick=closeModal;
    $('#mO').onclick=async()=>{const code=$('#eCode').value.trim();const {id,...rest}=t;const r={...rest,code,name:$('#eName').value.trim()||t.name,desig:$('#eDesig').value.trim(),subject:$('#eSub').value.trim(),shift:$('#eShift').value,active:$('#eAct').checked,order:ordOf(code,t.order??999)};
      const unl=$('#eUn')&&$('#eUn').checked; if(unl){delete r.uid;delete r.email;} try{await saveT(t.id,r); if(unl&&t.uid) await fs.doc('att_staff/'+t.uid).delete(); closeModal();toast('Saved');}catch(e){closeModal();fbErr(e);}};
    $('#mD').onclick=()=>{closeModal();confirmBox('Delete '+t.name+'?','The teacher disappears from all reports. To keep past records, untick Active instead.','Delete',async()=>{try{await fs.collection('att_teachers').doc(t.id).delete();toast('Deleted');}catch(e){fbErr(e);}});};});
}

/* ================= ADMIN: SETTINGS ================= */
function vSet(){
  const c=S.cfg,y0=new Date().getFullYear(),yrs=[];for(let y=y0-3;y<=y0+3;y++)yrs.push(y);
  const mSel=(id,ym)=>{const[y,m]=ym.split('-').map(Number);return `<div class="row" style="gap:6px"><select class="inp" id="${id}M">${MONTHS.map((n,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${n}</option>`).join('')}</select><select class="inp" id="${id}Y">${(yrs.includes(y)?yrs:yrs.concat([y])).map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select></div>`;};
  const tm=(id,v)=>`<input type="time" class="inp" id="${id}" value="${esc(v)}">`;
  return `<div class="card"><h2>Academic session</h2><p class="sub">Change the months any time – reports follow automatically.</p>
    <div class="grid2"><label class="f">Session name<input class="inp" id="sName" value="${esc(c.session)}"></label><label class="f">Starts<span>${mSel('sS',c.start)}</span></label><label class="f">Ends<span>${mSel('sE',c.end)}</span></label><label class="f">Count attendance from<input type="date" class="inp" id="sTrack" value="${esc(c.trackFrom)}"></label></div>
    <p class="sub" style="margin:10px 0 0">Days before “Count attendance from” are not counted, so nobody is absent for the time before the app started.</p></div>
  <div class="card"><h2>Marking time (per shift)</h2><p class="sub">“I am Present” works only between Opens and Closes. After Late time = Late. Not marked by Closes = Absent.</p>
    <div class="grid2"><label class="f">Morning – opens${tm('mO',c.mOpen)}</label><label class="f">Morning – late after${tm('mL',c.mLate)}</label><label class="f">Morning – closes${tm('mCl',c.mClose)}</label></div>
    <div class="grid2" style="margin-top:10px"><label class="f">Noon – opens${tm('nO',c.nOpen)}</label><label class="f">Noon – late after${tm('nL',c.nLate)}</label><label class="f">Noon – closes${tm('nCl',c.nClose)}</label></div></div>
  <div class="card"><h2>Weekly off</h2><div class="checks"><label class="chk"><input type="checkbox" id="oSun" ${c.offSun?'checked':''}> Sunday</label><label class="chk"><input type="checkbox" id="oSatAll" ${c.offSatAll?'checked':''}> Every Saturday</label>${[1,2,3,4,5].map(n=>`<label class="chk"><input type="checkbox" class="oSat" value="${n}" ${(c.offSats||[]).includes(n)?'checked':''}> ${['','1st','2nd','3rd','4th','5th'][n]} Saturday</label>`).join('')}</div></div>
  <div class="card"><h2>Leave &amp; duty types</h2><p class="sub">Teachers choose from these when they apply. Days per session 0 = no limit. “Counts as present” is for duty (e.g. On Duty, exam duty).</p>
    <div id="ltList">${LT().map((x,i)=>`<div class="row lt" style="margin-bottom:8px"><input class="inp" data-k="code" value="${esc(x.code)}" maxlength="4" style="width:70px" placeholder="Code"><input class="inp grow" data-k="name" value="${esc(x.name)}" placeholder="Name" style="min-width:120px"><input type="number" min="0" class="inp" data-k="quota" value="${+x.quota||0}" style="width:80px" title="Days per session"><label class="chk"><input type="checkbox" data-k="present" ${x.present?'checked':''}> Counts as present</label><button class="btn sm danger" data-rmlt="${i}">✕</button></div>`).join('')}</div>
    <button class="btn sm" id="addLT">+ Add type</button><p class="sub" style="margin:8px 0 0">Press <b>Save Settings</b> after changes.</p></div>
  <div class="card"><h2>School details</h2><div class="grid2"><label class="f">School<input class="inp" id="sSch" value="${esc(c.school)}"></label><label class="f">Motto<input class="inp" id="sMot" value="${esc(c.motto)}"></label><label class="f">Principal<input class="inp" id="sPr" value="${esc(c.principal)}"></label></div><label class="f" style="margin-top:10px">Address<input class="inp" id="sAd" value="${esc(c.address)}"></label></div>
  <div class="row" style="margin-bottom:14px"><button class="btn pri" id="saveCfg">Save Settings</button></div>
  <div class="card"><h2>Holidays</h2><div class="row"><input type="date" class="inp" id="hF"><span class="tmeta">to</span><input type="date" class="inp" id="hT"><input class="inp grow" id="hN" placeholder="Holiday name" style="min-width:140px"><button class="btn pri" id="addH">Add</button></div>
    ${(c.holidays||[]).length?[...c.holidays].sort((a,b)=>a.from.localeCompare(b.from)).map(h=>`<div class="hol"><div><b>${esc(h.name)}</b><div class="tmeta">${fmtDate(h.from)}${h.to&&h.to!==h.from?' – '+fmtDate(h.to):''}</div></div><button class="btn sm danger" data-dh="${esc(h.from)}|${esc(h.name)}">Remove</button></div>`).join(''):'<div class="empty">No holidays yet.</div>'}</div>
  <div class="card"><h2>Share the app with teachers</h2><p class="sub">Send this link to the staff WhatsApp group. Each teacher installs the SJS School app and creates their own account.</p><button class="btn gold" id="shApp">Share app link on WhatsApp</button></div>`;
}
const saveCfg=cfg=>fs.doc('att_config/settings').set(cfg);
function bSet(){
  $('#saveCfg').onclick=async()=>{const start=$('#sSY').value+'-'+pad($('#sSM').value),end=$('#sEY').value+'-'+pad($('#sEM').value);if(end<start){toast('Session must end after it starts');return;}
    const tms={mOpen:$('#mO').value,mLate:$('#mL').value,mClose:$('#mCl').value,nOpen:$('#nO').value,nLate:$('#nL').value,nClose:$('#nCl').value};
    if(Object.values(tms).some(v=>!okHM(v))){toast('Please fill all times');return;}
    if(!(tms.mOpen<=tms.mLate&&tms.mLate<=tms.mClose&&tms.nOpen<=tms.nLate&&tms.nLate<=tms.nClose)){toast('Times must be in order: opens ≤ late ≤ closes');return;}
    const lts=[...document.querySelectorAll('.lt')].map(r=>({code:r.querySelector('[data-k=code]').value.trim().toUpperCase().replace(/[^A-Z]/g,''),name:r.querySelector('[data-k=name]').value.trim(),quota:+r.querySelector('[data-k=quota]').value||0,present:r.querySelector('[data-k=present]').checked})).filter(x=>x.code);
    if(lts.some(x=>['P','L','A','W','H'].includes(x.code))){toast('Codes P, L, A, W, H are already used – choose another');return;}
    if(new Set(lts.map(x=>x.code)).size!==lts.length){toast('Two leave types have the same code');return;}
    try{await saveCfg({...S.cfg,leaveTypes:lts.length?lts:DEFAULT_CFG.leaveTypes,session:$('#sName').value.trim()||S.cfg.session,start,end,trackFrom:$('#sTrack').value||start+'-01',...tms,offSun:$('#oSun').checked,offSatAll:$('#oSatAll').checked,offSats:[...document.querySelectorAll('.oSat')].filter(x=>x.checked).map(x=>+x.value),school:$('#sSch').value.trim(),motto:$('#sMot').value.trim(),principal:$('#sPr').value.trim(),address:$('#sAd').value.trim()});toast('Settings saved');}catch(e){fbErr(e);}};
  const ltRow=()=>`<div class="row lt" style="margin-bottom:8px"><input class="inp" data-k="code" maxlength="4" style="width:70px" placeholder="Code"><input class="inp grow" data-k="name" placeholder="Name" style="min-width:120px"><input type="number" min="0" class="inp" data-k="quota" value="0" style="width:80px"><label class="chk"><input type="checkbox" data-k="present"> Counts as present</label><button class="btn sm danger" data-rmlt="x">✕</button></div>`;
  const bindRm=()=>document.querySelectorAll('[data-rmlt]').forEach(b=>b.onclick=()=>b.closest('.lt').remove());
  $('#addLT').onclick=()=>{$('#ltList').insertAdjacentHTML('beforeend',ltRow());bindRm();}; bindRm();
  $('#addH').onclick=async()=>{const from=$('#hF').value,to=$('#hT').value||from,name=$('#hN').value.trim()||'Holiday';if(!from){toast('Choose the date');return;}if(to<from){toast('End date is before start');return;}try{await saveCfg({...S.cfg,holidays:[...(S.cfg.holidays||[]),{from,to,name}]});toast('Holiday added');}catch(e){fbErr(e);}};
  document.querySelectorAll('[data-dh]').forEach(b=>b.onclick=async()=>{const[f,n]=b.dataset.dh.split('|');try{await saveCfg({...S.cfg,holidays:S.cfg.holidays.filter(h=>!(h.from===f&&h.name===n))});toast('Removed');}catch(e){fbErr(e);}});
  $('#shApp').onclick=()=>{const link=location.origin+location.pathname;window.open('https://wa.me/?text='+encodeURIComponent(`*${S.cfg.school} – SJS School app*\n\n1. Open: ${link}\n2. Install it (Chrome ⋮ → Install app / iPhone Share → Add to Home Screen)\n3. Tap "New teacher – create account" with your email and a password\n4. Choose your name. After the Admin confirms you, you can use My Attendance, Notices, Student Attendance and the Time Table.`),'_blank');};
}

/* ================= Start ================= */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{ if(S.user&&!document.querySelector('input:focus,textarea:focus,select:focus')&&!$('#modalBg').classList.contains('show')) render(); },60000);
start();
</script>
