<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UFM Record – SJS App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="sjs-nav.js"></script>
<style>
/* VOICE: the Exam In-charge's office register — formal, exact, calm, never alarming
   IDEA: a bound UFM register of numbered case slips, each stamped with an offence seal
   PICTURE: the live register and its seals (1st gold, 2nd orange, 3rd crimson) are the picture
   COLOUR and TYPE: crest navy field, crimson cross accent, gold rule; Plus Jakarta Sans UI, Source Serif 4 letters
   LAYOUT: crest bar on top, side rail on desktop, bottom bar on phone, one working panel */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5fa,#0b1222);--card:light-dark(#ffffff,#131c31);--ink:light-dark(#14213d,#e6ebf5);
--mut:light-dark(#5b6782,#9aa6c0);--line:light-dark(#dfe4ee,#26324d);--soft:light-dark(#eef1f8,#1a2540);
--navy:#1b2f5b;--navy2:#13234a;--red:#b3202a;--gold:#c9a227;
--l1:light-dark(#a87b00,#e7c25a);--l1b:light-dark(#fff6d9,#3a3110);
--l2:light-dark(#c2410c,#fb923c);--l2b:light-dark(#ffeadb,#3d2312);
--l3:light-dark(#b3202a,#f87171);--l3b:light-dark(#fde2e4,#401a1e);
--ok:light-dark(#0f7a4a,#4ade80);--okb:light-dark(#dcf5e9,#123425)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:8px max(2vw,12px);border-bottom:3px solid var(--gold)}
.top img{width:42px;height:42px;border-radius:50%;background:#fff;flex:none}
.brand{flex:1;line-height:1.2}.brand b{display:block;font-size:17px;font-weight:800}.brand span{font-size:12px;opacity:.8}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px 10px;min-height:40px}
.top select option{color:#14213d}
.sync{font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync.on{background:#1f7a4f}
.back{color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.3);white-space:nowrap}
.gate{position:fixed;inset:61px 0 0 0;z-index:31;background:var(--bg);display:grid;place-items:center;padding:20px}
.gate[hidden]{display:none}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:460px;width:100%;text-align:center}
.gbox img{width:96px;height:96px}.gbox h2{font-size:24px;margin:12px 0 6px}.gbox p{color:var(--mut);margin:0 0 16px}
#ufmChips,.ufmtool{display:none}
body.in-sjs .top,body.in-sjs .rail,body.in-sjs .bnav{display:none!important}
body.in-sjs .shell{display:block;min-height:0}
body.in-sjs main{margin:0 auto}
body.in-sjs #ufmChips{display:block}
body.in-sjs .ufmtool{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-bottom:6px}
.ufmtool .sync{background:var(--soft);color:var(--mut);font-weight:700}.ufmtool .sync.on{background:var(--okb);color:var(--ok)}
.ufmtool select{min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:700}
body.in-sjs .gate{inset:calc(56px + env(safe-area-inset-top,0px)) 0 0 0}
@media(min-width:1100px){body.in-sjs .gate{left:272px}}
@media(max-width:820px){body.in-sjs main{padding-bottom:24px}}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 61px)}
.rail{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
.rail a,.more a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;min-height:44px}
.rail a:hover,.more a:hover{background:var(--soft)}
.rail a.on{background:var(--navy);color:#fff}
.rail svg,.bnav svg,.more svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rail .cap{font-size:12px;color:var(--mut);padding:14px 12px 4px}
main{padding:clamp(14px,2.4vw,28px);max-width:1280px;width:100%}
.bnav{display:none}
.view{display:none}.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h1{font-size:clamp(24px,3vw,34px);font-weight:800}
.head p{margin:4px 0 0;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.card h3{font-size:15px;margin-bottom:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:clamp(26px,3vw,34px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--mut)}
.kpi.hero{background:var(--navy);color:#fff;border-color:var(--navy)}.kpi.hero span{color:#cdd6ea}
.kpi.k3 b{color:var(--l3)}.kpi.k2 b{color:var(--l2)}
.bar{display:grid;grid-template-columns:minmax(70px,120px) minmax(0,1fr) 34px;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .5s}
:root:not([data-theme=light]) .bt i{background:light-dark(var(--navy),#6f8fd6)}
:root .bt i.c1{background:var(--l1)}:root .bt i.c2{background:var(--l2)}:root .bt i.c3{background:var(--l3)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.seal{display:inline-grid;place-items:center;min-width:44px;padding:3px 8px;border-radius:99px;font-size:12px;font-weight:800;border:1.5px solid}
.s1{color:var(--l1);background:var(--l1b)}.s2{color:var(--l2);background:var(--l2b)}.s3{color:var(--l3);background:var(--l3b)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--mut);white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.pend{background:var(--l2b);color:var(--l2)}.tag.left{background:var(--l3b);color:var(--l3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut)}
label.f>span{display:block;margin-bottom:5px}
.in,select.in,textarea.in{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px;color:var(--ink)}
textarea.in{min-height:90px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px light-dark(#dbe3f5,#24345c)}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:var(--card);font-weight:700;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.newwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.preview{position:sticky;top:80px}
.offence{border-radius:14px;padding:16px;border:2px solid var(--line);background:var(--soft)}
.offence.o1{border-color:var(--l1);background:var(--l1b)}.offence.o2{border-color:var(--l2);background:var(--l2b)}.offence.o3{border-color:var(--l3);background:var(--l3b)}
.offence .big{font-size:30px;font-weight:800;line-height:1.1}
.offence small{display:block;color:var(--mut);font-size:13px}
.hist{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.hist li{padding:8px 0;border-top:1px dashed var(--line)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-align:left;color:var(--mut);font-weight:700;padding:10px 8px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--mut);font-size:12px}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}
td.ref{font-weight:700;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
:root:not([data-theme=light]) td.ref{color:light-dark(var(--navy),#9db4ec)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.act{font-size:12px;font-weight:700;max-width:160px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.list{display:grid;gap:8px}
.mini{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.mini:hover{border-color:var(--navy)}
.mini b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini span{font-size:12px;color:var(--mut)}
.stu{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.stu header{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.stu .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--navy);flex:none}
.stu h3{font-size:16px}.stu header p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.tl{list-style:none;margin:0;padding:6px 16px 12px}
.tl li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);align-items:start;cursor:pointer}
.tl li:last-child{border:0}
.paperwrap{background:light-dark(#d9deea,#0a0f1c);border-radius:16px;padding:clamp(8px,2vw,24px);overflow:auto}
.lettergrid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.gtbl td{vertical-align:middle}.gtbl tbody tr{cursor:default}
.gtbl .in{min-height:38px;font-size:14px;padding:6px 8px}
.rules h2{font-size:18px;margin:22px 0 8px;color:var(--navy)}
:root:not([data-theme=light]) .rules h2{color:light-dark(var(--navy),#9db4ec)}
.rules p,.rules li{max-width:75ch}
.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lvl div{border-radius:14px;padding:16px;border:2px solid}
.lvl b{display:block;font-size:22px;font-weight:800}
.lvl .s1{border-color:var(--l1)}.lvl .s2{border-color:var(--l2)}.lvl .s3{border-color:var(--l3)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--l1b);border:1px solid var(--l1);margin-bottom:14px;font-size:14px}
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);width:min(640px,94vw);max-height:90vh;box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,18,40,.55)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.dh h3{font-size:17px}
.db{padding:16px 18px}
.df{display:flex;flex-wrap:wrap;gap:8px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--card)}
.dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--mut)}.dl dd{margin:0;font-weight:600}
.x{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:20px;line-height:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#14213d;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.more{display:grid;gap:4px;padding:10px}
.note{font-size:13px;color:var(--mut)}
.listsgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.listsgrid textarea{min-height:160px;font-size:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;min-height:44px}
.chk input{width:20px;height:20px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filters .wide{grid-column:1/-1}.newwrap,.lettergrid{grid-template-columns:minmax(0,1fr)}.preview{position:static}.listsgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
 .shell{display:block}.rail{display:none}
 main{padding-bottom:96px}
 .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mut);text-decoration:none;min-height:48px;justify-content:center;border-radius:10px}
 .bnav a.on{color:var(--navy)}
 :root:not([data-theme=light]) .bnav a.on{color:light-dark(var(--navy),#9db4ec)}
 .bnav a.fab span.c{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(179,32,42,.4)}
 .g2,.g3{grid-template-columns:minmax(0,1fr)}
 .form{grid-template-columns:repeat(2,minmax(0,1fr))}.form .w2{grid-column:1/-1}
 .top .brand span{display:none}
}
@media(max-width:600px){
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
 .listsgrid,.lvl{grid-template-columns:minmax(0,1fr)}
 .dl{grid-template-columns:minmax(0,1fr)}.dl dt{margin-top:6px}
 .stack thead{display:none}.stack tr{display:grid;padding:10px 12px;border-bottom:1px solid var(--line)}
 .stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start;max-width:none}
 .stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:12px;font-weight:600}
 .stack td:empty{display:none}.tw{max-height:none}
 .top select{max-width:110px;padding:6px 8px}.back{padding:8px}.back span{display:none}.brand b{font-size:15px}.top img{width:36px;height:36px}
 #lsel{min-height:150px!important}
}
@media(max-width:430px){.sync{display:none}}
</style>
</head>

 S.sex=r.sex||'M';
 const pastNames=[...new Map(S.records.map(x=>[keyOf(x),x])).values()];
 $('#v-new').innerHTML=`<div class="head"><div><h1>${e?'Edit UFM case':'New UFM case'}</h1><p>${e?esc(e.ref):'Occurrence number, action/penalty, status and reference number are worked out automatically.'}</p></div></div>
 <div class="newwrap"><form class="card" id="nf" autocomplete="off"><div class="form">
 <label class="f"><span>Academic session</span><select class="in" id="n_session">${opts(st.sessions,r.session)}</select></label>

 <label class="f"><span>Exam date</span><input class="in" type="date" id="n_examDate" value="${esc(r.examDate)}" required></label>
 <label class="f"><span>Subject</span><select class="in" id="n_subject">${opts(st.subjects,r.subject,'Select')}</select></label>
 <label class="f w2"><span>Student name</span><input class="in" id="n_name" list="dlNames" value="${esc(r.name)}" required placeholder="Type to find a past student"></label>
 <label class="f w2"><span>Father's name</span><input class="in" id="n_father" value="${esc(r.father)}"></label>
 <label class="f"><span>Class</span><select class="in" id="n_cls">${opts(st.classes,r.cls,'Select')}</select></label>
 <label class="f"><span>Section</span><select class="in" id="n_sec">${opts(st.sections,r.sec,'Select')}</select></label>
 <label class="f"><span>Roll No.</span><input class="in" id="n_roll" inputmode="numeric" value="${esc(r.roll)}"></label>
 <div class="f"><label class="f"><span>Sex</span></label><div class="seg" id="n_sex"><button type="button" data-s="M" class="${S.sex==='M'?'on':''}">M</button><button type="button" data-s="F" class="${S.sex==='F'?'on':''}">F</button></div></div>
 <label class="f w2"><span>Case detector (invigilator)</span><input class="in" id="n_detector" list="dlDet" value="${esc(r.detector)}"></label>
 <label class="f w2"><span>Student status</span><select class="in" id="n_stu">${opts(['ACTIVE','LEFT'],r.stuStatus||'ACTIVE')}</select></label>
 <label class="f w4"><span>Remarks – pick a standard statement</span><select class="in" id="n_tpl">${opts(st.remarks,'','Choose a UFM examination remark…')}</select></label>
 <label class="f w4"><span>Remarks (you can edit)</span><textarea class="in" id="n_remarks">${esc(r.remarks)}</textarea></label>
 <details class="w4"><summary style="cursor:pointer;font-weight:700;min-height:36px">More case details (optional)</summary><div class="form" style="margin-top:12px">
 <label class="f"><span>Admission No.</span><input class="in" id="n_admNo" value="${esc(r.admNo)}"></label>
 <label class="f w2"><span>Evidence / material found</span><input class="in" id="n_evidence" value="${esc(r.evidence)}"></label>
 <label class="f"><span>Final action taken</span><input class="in" id="n_finalAction" value="${esc(r.finalAction)}"></label>
 <label class="f w2"><span>Student's statement</span><textarea class="in" id="n_statement">${esc(r.statement)}</textarea></label>
 <label class="f w2"><span>Principal's decision</span><textarea class="in" id="n_decision">${esc(r.decision)}</textarea></label></div></details>
 <div class="w4 row"><button class="btn pri" type="submit">${e?'Save changes':'Save UFM case'}</button>${e?'<button class="btn" type="button" id="nCancel">Cancel</button>':'<button class="btn" type="reset" id="nReset">Clear</button>'}</div></div>
 <datalist id="dlNames">${pastNames.map(x=>`<option value="${esc(x.name)}">${esc(x.father)} · ${esc(x.cls)}-${esc(x.sec)} · Roll ${esc(x.roll)}</option>`).join('')}</datalist>
 <datalist id="dlDet">${st.detectors.map(d=>`<option value="${esc(d)}">`).join('')}</datalist></form>
 <aside class="preview" id="nprev"></aside></div>`;
 const f=$('#nf');
 $('#n_sex').onclick=ev=>{const b=ev.target.closest('[data-s]');if(!b)return;S.sex=b.dataset.s;$$('#n_sex button').forEach(x=>x.classList.toggle('on',x===b))};
 $('#n_tpl').onchange=ev=>{if(ev.target.value)$('#n_remarks').value=ev.target.value};
 $('#n_name').addEventListener('change',()=>{const n=norm($('#n_name').value);const m=[...S.records].reverse().find(x=>norm(x.name)===n);if(m&&!e){if(!$('#n_father').value)$('#n_father').value=m.father||'';if(!$('#n_roll').value)$('#n_roll').value=m.roll||'';if(!$('#n_cls').value)$('#n_cls').value=m.cls||'';if(!$('#n_sec').value)$('#n_sec').value=m.sec||'';S.sex=m.sex||'M';$$('#n_sex button').forEach(x=>x.classList.toggle('on',x.dataset.s===S.sex))}nprev()});
 ['n_name','n_father','n_examDate'].forEach(id=>$('#'+id).addEventListener('input',nprev));
 if(e)$('#nCancel').onclick=()=>{S.editId='';location.hash='#record'};
 else $('#nReset').onclick=()=>setTimeout(nprev,0);
 f.onsubmit=async ev=>{ev.preventDefault();
  const g=id=>$('#n_'+id).value.trim();
  if(!g('name')){toast('Enter the student name');return}
  if(!g('subject')||!g('cls')){toast('Choose class and subject');return}
  const base=e?clone(e):{id:uid(),createdAt:Date.now(),give:{date:'',doc:'',to:'',remarks:''}};
  const sess=g('session');
  Object.assign(base,{session:sess,exam:g('exam'),examDate:g('examDate'),subject:g('subject'),name:norm(g('name')),father:norm(g('father')),cls:g('cls'),sec:g('sec'),roll:g('roll'),sex:S.sex,detector:g('detector'),stuStatus:g('stu'),remarks:g('remarks'),admNo:g('admNo'),evidence:g('evidence'),finalAction:g('finalAction'),statement:g('statement'),decision:g('decision')});
  if(!e||e.session!==sess){base.serial=nextSerial(sess);base.ref=mkRef(sess,base.serial)}
  const dup=!e&&S.records.find(x=>keyOf(x)===keyOf(base)&&x.examDate===base.examDate&&x.subject===base.subject);
  if(dup&&!await ask(`${base.name} already has a case on ${fd(base.examDate)} in ${base.subject} (${dup.ref}). Save another one?`,'Save anyway'))return;
  await saveRecord(base);S.editId='';S.letterId=base.id;S.letterDate='';
  toast(e?'Changes saved':`Saved ${base.ref}`);
  if(e){location.hash='#record'}else{rNew();showCase(base.id)}
 };
 nprev();
}
function nprev(){
 const n=norm($('#n_name')?.value),fa=norm($('#n_father')?.value),box=$('#nprev');if(!box)return;
 if(!n){box.innerHTML=`<div class="offence"><small>Offence preview</small><div class="big">—</div><span class="note">Type the student's name. Past UFM cases are found automatically, across all sessions.</span></div>`;return}
 const prior=S.records.filter(x=>x.id!==S.editId&&norm(x.name)===n&&(!fa||norm(x.father)===fa));
 const o=prior.length+1;
 box.innerHTML=`<div class="offence o${Math.min(o,3)}"><small>This case will be the student's</small><div class="big">${ord(o)} offence</div><b>${ACTION(o)}</b><small style="margin-top:6px">${esc(LT(o)[0])}</small>${prior.length?`<ul class="hist">${prior.sort(byRef).map(x=>`<li><b>${esc(x.ref)}</b><br>${esc(x.exam)} · ${esc(x.subject)} · ${fd(x.examDate)} · ${esc(x.cls)}-${esc(x.sec)}</li>`).join('')}</ul>`:'<p class="note" style="margin:8px 0 0">No earlier UFM case found for this student.</p>'}</div>`;
}

/* ---------- students ---------- */
function rStudents(){
 $('#v-students').innerHTML=`<div class="head"><div><h1>Search student</h1><p>Find by roll number or name — the whole UFM history across every session.</p></div></div>
 <div class="filters" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)"><label class="f"><span>Roll No. or name</span><input class="in" id="sq" placeholder="e.g. 9 or DANIEL" value="${esc(S.sq||'')}"></label><label class="f"><span>Class</span><select class="in" id="scls">${opts(S.settings.classes,S.scls||'','Any class')}</select></label><label class="f"><span>Show</span><select class="in" id="sshow"><option value="">All students</option><option value="r"${S.sshow==='r'?' selected':''}>Repeat offenders only</option></select></label></div><div id="sres" class="grid g2"></div>`;
 const run=()=>{S.sq=$('#sq').value;S.scls=$('#scls').value;S.sshow=$('#sshow').value;drawStudents()};
 $('#sq').oninput=run;$('#scls').onchange=run;$('#sshow').onchange=run;drawStudents();
}
function drawStudents(){
 const q=norm(S.sq),groups=new Map();
 [...S.records].sort(byRef).forEach(r=>{const k=keyOf(r);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
 let list=[...groups.values()].filter(g=>{const l=g[g.length-1];
  if(q&&!g.some(r=>norm(r.name).includes(q)||String(r.roll)===S.sq.trim()||norm(r.father).includes(q)))return false;
  if(S.scls&&l.cls!==S.scls)return false;if(S.sshow==='r'&&g.length<2)return false;return true});
 list.sort((a,b)=>b.length-a.length||norm(a[0].name).localeCompare(norm(b[0].name)));
 $('#sres').innerHTML=list.length?list.map(g=>{const l=g[g.length-1],t=g.length;return`<article class="stu"><header><div class="av" style="background:${t>=3?'var(--red)':t==2?'#c2410c':'var(--navy)'}">${esc((l.name||'?').split(' ').map(w=>w[0]).slice(0,2).join(''))}</div><div style="flex:1"><h3>${esc(l.name)}</h3><p>${esc(l.father)} · ${esc(l.cls)}-${esc(l.sec)} · Roll ${esc(l.roll)}${(l.stuStatus||'ACTIVE')==='LEFT'?' · LEFT':''}</p></div>${seal(t)}</header><ul class="tl">${g.map(r=>`<li data-id="${esc(r.id)}">${seal(occ(r))}<div><b>${esc(r.exam)} · ${esc(r.subject)}</b><br><span class="note">${esc(r.ref)} · ${fd(r.examDate)} · ${ACTION(occ(r))}</span></div>${r.give?.date?'<span class="tag ok">Given</span>':'<span class="tag pend">Pending</span>'}</li>`).join('')}</ul></article>`}).join(''):`<div class="card empty" style="grid-column:1/-1"><b>${S.records.length?'No student found':'No UFM cases yet'}</b>${S.records.length?'Check the spelling or try the roll number.':'Cases you add will appear here.'}</div>`;
}

/* ---------- letters ---------- */
const LETTER_CSS=`.letter{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#111;padding:14mm 16mm 12mm;font:11.5pt/1.5 "Source Serif 4",Georgia,serif;box-shadow:0 10px 30px rgba(0,0,0,.18);display:flex;flex-direction:column}
.letter .lh{display:grid;grid-template-columns:26mm minmax(0,1fr) 26mm;align-items:center;gap:4mm;border-bottom:3px double #1b2f5b;padding-bottom:4mm}
.letter .lh img{width:26mm;height:26mm}
.letter .lh div{text-align:center}.letter .lh h1{font:800 21pt/1.1 "Plus Jakarta Sans",Arial,sans-serif;color:#1b2f5b;margin:0;letter-spacing:.5px}
.letter .lh .m{font-style:italic;color:#b3202a;font-size:11pt}.letter .lh .a{font-size:9.5pt;color:#333;line-height:1.35}
.letter .tt{margin:6mm auto 4mm;text-align:center;border:2px solid #b3202a;border-radius:3mm;padding:3mm 6mm;max-width:150mm}
.letter .tt b{display:block;font:800 13.5pt/1.25 "Plus Jakarta Sans",Arial,sans-serif;color:#b3202a}.letter .tt span{font-size:10.5pt}
.letter .rd{display:flex;justify-content:space-between;font-weight:700;margin-bottom:3mm;font-size:10.5pt}
.letter table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-bottom:5mm}
.letter td{border:1px solid #9aa3b5;padding:1.6mm 3mm;vertical-align:top;color:#111;background:#fff}.letter td:first-child{width:42mm;font-weight:700;background:#f1f4fa}
.letter td.pen{font-weight:800;color:#b3202a}
.letter p{margin:0 0 3mm;text-align:justify}
.letter .sig{margin-top:auto;padding-top:16mm;display:grid;grid-template-columns:repeat(3,1fr);gap:8mm;text-align:center;font-size:10pt}
.letter .sig div{border-top:1px solid #111;padding-top:1.5mm}.letter .sig b{display:block;font-size:9.5pt;text-transform:uppercase}
.letter .ft{margin-top:6mm;font-size:8.5pt;color:#666;text-align:center;border-top:1px solid #ddd;padding-top:2mm}`;
document.head.insertAdjacentHTML('beforeend',`<style>${LETTER_CSS}.paper tbody tr{cursor:auto}.paper tbody tr:hover td{background:#fff}.paper tbody tr:hover td:first-child{background:#f1f4fa}.paper th{position:static}</style>`);
function letterHtml(r,date){
 const st=S.settings,o=occ(r),[t1,t2]=LT(o),sc=st.school;
 const body=o<=1?[`This is to inform you that the above-named student has been reported for using unfair means during the examination mentioned above. The matter has been recorded in the school's UFM Record / Register, and the applicable disciplinary action is indicated above.`,`Any further violation will result in the next level of disciplinary action in accordance with the school's UFM rules.`,`Therefore, you are requested to counsel the student to maintain the highest standards of honesty, discipline and conduct in all future examinations.`]
 :o==2?[`This is to inform you that the above-named student has again been reported for using unfair means during the examination mentioned above. This is the student's second recorded UFM offence. The matter has been entered in the school's UFM Record / Register, and the disciplinary action indicated above has been applied.`,`This letter is a FINAL WARNING. Any further violation will lead to the case being referred to the Principal / School Management for major disciplinary action, which may include expulsion from the school.`,`You are requested to counsel the student seriously so that such conduct is not repeated in any future examination.`]
 :[`This is to inform you that the above-named student has been reported for using unfair means during the examination mentioned above. This is the student's ${ord(o)} recorded UFM offence, despite earlier warnings.`,`In accordance with the school's UFM rules, the case is referred to the Principal / School Management for major disciplinary action, including possible expulsion / discontinuation from the school, subject to the school's rules, applicable requirements and due process.`,`You are requested to meet the Principal along with the student at the earliest.`];
 const tr=(k,v,c)=>`<tr><td>${k}</td><td${c?` class="${c}"`:''}>${esc(v)}</td></tr>`;
 return`<div class="letter"><div class="lh"><img src="${LOGO}" alt=""><div><h1>${esc(sc.name)}</h1><div class="m">Motto: ${esc(sc.motto)}</div><div class="a">${esc(sc.address)}<br>${esc(sc.affil)}<br>Email: ${esc(sc.email)}</div></div><span></span></div>
 <div class="tt"><b>${esc(t1)}</b><span>(${esc(t2)})</span></div>
 <div class="rd"><span>UFM ID: ${esc(r.ref)}</span><span>Date: ${fd(date)}</span></div>
 <table>${tr('Student Name',r.name)}${tr("Father's Name",r.father)}${tr('Class / Section',r.cls+' / '+r.sec)}${tr('Roll No.',r.roll)}${tr('Subject',r.subject)}${tr('Exam Date',fd(r.examDate))}${tr('Examination',r.exam)}${tr('Occurrence No.',ord(o)+' offence')}${tr('Action / Penalty',ACTION(o),'pen')}${tr('Case Details',r.remarks)}</table>
 <p>Dear Parent/Guardian,</p>${body.map(p=>`<p>${esc(p)}</p>`).join('')}
 <div class="sig"><div><b>${esc(r.father||'')}</b>Parent/Guardian</div><div><b>${esc(st.examIncharge)}</b>Exam In-charge</div><div><b>${esc(st.principal)}</b>Principal</div></div>
 <div class="ft">${esc(sc.name)} · UFM Record ${esc(r.session)} · Confidential school record</div></div>`;
}
function rLetters(){
 const rs=[...vis()].sort(byRef).reverse();
 if(!S.letterId||!S.records.some(r=>r.id===S.letterId))S.letterId=rs[0]?.id||'';
 const r=S.records.find(x=>x.id===S.letterId);
 const date=r?(S.letterDate&&S.letterFor===r.id?S.letterDate:(r.give?.date||today())):today();
 $('#v-letters').innerHTML=`<div class="head"><div><h1>Warning letter</h1><p>The letter type follows the offence: 1st – Warning, 2nd – Final Warning, 3rd – Disciplinary Action Notice.</p></div></div>
 ${rs.length?`<div class="lettergrid"><div class="card"><label class="f"><span>Select by roll no. / name</span><input class="in" id="lq" placeholder="Filter list…"></label><label class="f" style="margin-top:10px"><span>UFM case</span><select class="in" id="lsel" size="8" style="min-height:220px">${rs.map(x=>`<option value="${esc(x.id)}"${x.id===S.letterId?' selected':''}>${esc(x.ref.split('/').pop())} · ${esc(x.name)} · Roll ${esc(x.roll)} · ${esc(x.subject)}</option>`).join('')}</select></label>
 <label class="f" style="margin-top:10px"><span>Letter date</span><input class="in" type="date" id="ldate" value="${esc(date)}"></label>
 <div class="grid" style="margin-top:14px"><button class="btn pri" data-act="printLetter">${svg('print')}Print / Download letter</button><button class="btn" data-act="giveLetter">${svg('giveout')}${r?.give?.date?'Update give-out entry':'Mark as given out'}</button><button class="btn" data-act="batch">${svg('print')}All pending letters</button></div>
 <p class="note">On a phone, the letter downloads as a page that prints by itself when opened.</p></div>
 <div class="paperwrap"><div class="paper" style="width:max-content;margin:0 auto">${r?letterHtml(r,date):''}</div></div></div>`:`<div class="card">${emptyBox()}</div>`}`;
 if(!rs.length)return;
 $('#lsel').onchange=e=>{S.letterId=e.target.value;S.letterDate='';rLetters()};
 $('#ldate').onchange=e=>{S.letterDate=e.target.value;S.letterFor=S.letterId;rLetters()};
 $('#lq').oninput=e=>{const q=norm(e.target.value);[...$('#lsel').options].forEach(o=>o.hidden=q&&!norm(o.textContent).includes(q))};
 fitPaper();
}
function fitPaper(){const w=$('.paperwrap'),p=$('.paper');if(!w||!p)return;p.style.zoom='';const pad=parseFloat(getComputedStyle(w).paddingLeft)||0;const s=Math.min(1,(w.clientWidth-pad*2-4)/p.scrollWidth);p.style.zoom=s<1?s:'';}
window.addEventListener('resize',()=>{if(S.view==='letters')fitPaper()});
function giveForm(r){
 const st=S.settings,g=r.give||{};const o=occ(r);
 openDlg(`<div class="dh"><div><h3>Give out – ${esc(r.ref)}</h3><span class="note">${esc(r.name)}</span></div><button class="x" data-close>×</button></div><form class="db" id="gf"><div class="form" style="grid-template-columns:repeat(2,minmax(0,1fr))">

 <div class="row" style="margin-top:14px"><button class="btn pri" type="submit">Save</button>${g.date?'<button class="btn ghost" type="button" id="g_clear">Clear entry</button>':''}</div></form>`);
 $('#gf').onsubmit=async e=>{e.preventDefault();const n=clone(r);n.give={date:$('#g_date').value,doc:$('#g_doc').value,to:$('#g_to').value.trim(),remarks:$('#g_rem').value.trim()};closeDlg();await saveRecord(n);toast('Give-out register updated')};
 if(g.date)$('#g_clear').onclick=async()=>{const n=clone(r);n.give={date:'',doc:'',to:'',remarks:''};closeDlg();await saveRecord(n);toast('Entry cleared')};
}

/* ---------- rules ---------- */
function rRules(){
 const L=(t,a)=>`<h2>${t}</h2><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
 $('#v-rules').innerHTML=`<div class="head"><div><h1>UFM rules &amp; policy</h1><p>${esc(S.settings.school.name)} · Unfair Means &amp; Examination Malpractice Policy</p></div></div>
 <div class="lvl"><div class="s1"><span class="seal s1">1st</span><b>Zero marks</b>in that particular subject + written warning</div><div class="s2"><span class="seal s2">2nd</span><b>Zero marks</b>in all subjects of that examination + final warning</div><div class="s3"><span class="seal s3">3rd</span><b>Expulsion</b>from the school, subject to school rules and due process</div></div>
 <div class="card rules" style="margin-top:14px"><p><b>Record-keeping.</b> UFM incidents are recorded across academic sessions to identify repeated misconduct during the student's entire stay in the school. <b>Academic session:</b> 1 April to 31 March (e.g., 2026–2027).</p>
 <h2>1. Purpose</h2><p>The purpose of this policy is to maintain fairness, academic integrity, discipline and equal opportunity for every student during all school examinations. The School expects every student to complete examinations honestly and independently. Any act intended to obtain or provide an unfair advantage may be treated as Unfair Means (UFM) / Examination Malpractice.</p>
 ${L('2. Scope – this policy applies to',['Periodic Test–I (PT-1)','Half-Yearly Examination','Periodic Test–II (PT-2)','Annual Examination','Re-examinations',"Any other examination or assessment conducted under the School's authority"])}
 ${L('3. What constitutes UFM / examination malpractice?',['Possession or use of written notes, slips, books or other unauthorized material.',"Copying or attempting to copy from another student's answer script.",'Showing answers to another student or helping another student to copy.','Communicating, signaling or attempting to communicate with another candidate during the examination without permission.','Possession or use of mobile phones, smart watches, earphones or other unauthorized electronic/digital devices.','Writing answers or information relevant to the examination on the body, desk, stationery or any unauthorized surface/material.','Exchange of answer scripts, question papers, stationery or other materials for the purpose of obtaining or providing an unfair advantage.',"Impersonation or permitting another person to write an examination on one's behalf.",'Tampering with, damaging, removing or tearing pages of an answer script.','Taking an answer script, question paper or other examination material outside the examination hall without authorization.','Refusal to comply with reasonable instructions given by the invigilator or examination authority.','Attempting to obtain assistance or an unfair advantage by any unauthorized means.','Any other act, whether deliberate or attempted, that compromises the fairness, confidentiality or integrity of the examination.'])}
 ${L('4. Procedure for dealing with a UFM case',['<b>Step 1 – Detection:</b> The invigilator/examination staff shall identify and record the suspected incident.','<b>Step 2 – Securing evidence:</b> Any unauthorized material or other relevant evidence may be secured and preserved for examination by the appropriate school authority.','<b>Step 3 – Incident report:</b> The invigilator shall prepare a written UFM Incident Report containing the relevant details of the incident.',"<b>Step 4 – Student's statement:</b> The student shall be given an opportunity to provide a written explanation or statement regarding the incident.",'<b>Step 5 – Review:</b> The case shall be reviewed by the Principal / Examination In-charge / designated UFM Committee, as applicable.',"<b>Step 6 – Decision:</b> After considering the available evidence and the student's explanation, the appropriate disciplinary action shall be determined.","<b>Step 7 – Record:</b> The final decision shall be entered in the School's UFM Register and communicated to the student and parent/guardian where appropriate."])}
 <h2>5. Progressive disciplinary action</h2><div class="scroll"><table style="cursor:auto"><thead><tr><th>Offence level</th><th>Classification</th><th>Disciplinary action</th></tr></thead><tbody style="cursor:auto"><tr><td>First offence</td><td>UFM – First Offence</td><td>Zero marks in the concerned subject + Written Warning</td></tr><tr><td>Second offence</td><td>UFM – Second Offence</td><td>Zero marks in all subjects of the examination concerned + Final Warning</td></tr><tr><td>Third offence</td><td>UFM – Third Offence</td><td>Recommendation for expulsion/discontinuation from the School, subject to the School's rules, applicable requirements and due process</td></tr></tbody></table></div>
 ${L('5.1 First offence – the student may receive',['Zero (0) marks in the concerned subject.','A formal Written Warning Letter.',"Entry in the School's UFM Register.",'Parent/Guardian notification, where considered appropriate.'])}
 ${L('5.2 Second offence – the student may receive',['Zero (0) marks in all subjects of the examination concerned.','A Final Warning Letter.','Entry/update in the UFM Register.','Parent/Guardian notification and counselling, where appropriate.'])}
 <h2>5.3 Third offence</h2><p>For a third confirmed UFM offence, the case may be referred to the Principal/School Management for major disciplinary action, including possible expulsion or discontinuation from the School, subject to the School's rules, applicable requirements and due process. A third offence should therefore be treated as a Disciplinary Action Notice, rather than merely another warning letter.</p>
 ${L('6. Serious UFM cases',['Impersonation.','Organized or deliberate cheating.','Possession or use of electronic communication devices for cheating.','Deliberate destruction or alteration of examination records.','Threatening, intimidating or obstructing examination staff.','Leakage, unauthorized possession or distribution of confidential examination material.','Any other conduct that seriously compromises examination integrity.'])}<p>The School may consider a serious first or subsequent offence separately where the nature of the misconduct warrants enhanced disciplinary action. The disciplinary action in such cases shall be determined by the competent school authority after considering the circumstances and applicable rules.</p>
 ${L('7. Important principles',['Every UFM case is properly documented.','Evidence relating to the incident is preserved wherever practicable.','The student is given an opportunity to explain the alleged misconduct.','Disciplinary action is based on the facts and circumstances of the case.','Repeated offences are recorded and considered when determining subsequent action.','Parents/Guardians are informed where appropriate.','Confidentiality of UFM records is maintained.','UFM records are retained by the School for future reference in accordance with its record-retention practices.'])}
 ${L('8. Official classification of UFM letters',['<b>First offence:</b> WARNING LETTER – FIRST OFFENCE (Unfair Means / Examination Malpractice)','<b>Second offence:</b> FINAL WARNING LETTER – SECOND OFFENCE (Repeated Unfair Means / Examination Malpractice)','<b>Third offence:</b> DISCIPLINARY ACTION NOTICE – THIRD OFFENCE (Repeated Unfair Means / Examination Malpractice)'])}
 <h2>9. UFM record</h2><p>UFM Reference No. · Student Name · Admission No. · Roll No. · Class &amp; Section · Examination · Subject · Examination Date · Nature of UFM · Evidence/Material Found · Invigilator's Report · Student's Statement · Previous UFM Count · Current Offence Level · Recommended Action · Principal's Decision · Warning/Disciplinary Letter No. · Letter Issue Date · Parent/Guardian Acknowledgement · Final Action Taken · Remarks — all kept in this app.</p>
 <h2>10. Policy authority</h2><p>This policy shall be implemented under the authority of the Principal and School Management and may be reviewed or amended from time to time to remain consistent with applicable CBSE requirements, School rules and other applicable regulations.</p></div>`;
}

  rec.serial=Math.max(nextSerial(sess),...fresh.filter(x=>x.session===sess).map(x=>x.serial+1));rec.ref=mkRef(sess,rec.serial);fresh.push(rec);added++}
 const ls=wb.SheetNames.find(n=>/^lists$/i.test(n.trim()));let listsMsg='';
 if(ls){const L=XLSX.utils.sheet_to_json(wb.Sheets[ls],{header:1,defval:''});const hd=(L[0]||[]).map(x=>String(x).trim().toLowerCase());const col=k=>{const i=hd.findIndex(h=>h.startsWith(k));return i<0?[]:[...new Set(L.slice(1).map(r=>String(r[i]).trim()).filter(Boolean))]};
  const n=clone(st);const ex=col('exam');if(ex.length&&!/incharge/i.test(hd.find(h=>h.startsWith('exam'))||''))n.exams=ex;[['class','classes'],['section','sections'],['suj','subjects'],['subj','subjects'],['ufm examination remarks','remarks']].forEach(([k,f])=>{const v=col(k);if(v.length)n[f]=v});
  const ei=col('exam incharge'),pr=col('principal');if(ei[0])n.examIncharge=ei[0];if(pr[0])n.principal=pr[0];S.settings=n;await saveSettings();listsMsg=' · lists updated'}
 if(!added){toast(`Nothing new to import (${skipped} already in the app)${listsMsg}`);return}
 if(!await ask(`Add ${added} UFM case${added>1?'s':''} from "${name}"? ${skipped?skipped+' already in the app will be skipped.':''}`,'Import'))return;
 for(const r of fresh)await saveRecord(r);toast(`Imported ${added} case${added>1?'s':''}${listsMsg}`);
}
async function restoreJson(file){
 let d;try{d=JSON.parse(await file.text())}catch(e){toast('That is not a valid backup file');return}
 if(!Array.isArray(d.records)){toast('That is not a SJS UFM backup');return}
 if(!await ask(`Restore ${d.records.length} cases from this backup? Cases with the same ID are replaced; others are kept.`,'Restore'))return;
 if(d.settings){S.settings=Object.assign(clone(DEF),d.settings);await saveSettings()}
 for(const r of d.records){if(r&&r.id&&r.name)await saveRecord(r)}toast('Backup restored');
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-close],[data-id],[data-stu],[data-act],[data-letter],[data-edit],[data-copy],[data-left],[data-del]');if(!t)return;
 if(t.dataset.close!==undefined){closeDlg();return}
 if(t.dataset.letter){closeDlg();S.letterId=t.dataset.letter;S.letterDate='';location.hash='#letters';if(S.view==='letters')rLetters();return}
 if(t.dataset.edit){closeDlg();S.editId=t.dataset.edit;if(S.view==='new')rNew();else location.hash='#new';return}
 if(t.dataset.copy){const r=S.records.find(x=>x.id===t.dataset.copy);if(r)copyText(summaryText(r));return}
 if(t.dataset.left){const r=S.records.find(x=>x.id===t.dataset.left);if(!r)return;const n=clone(r);n.stuStatus=(r.stuStatus||'ACTIVE')==='LEFT'?'ACTIVE':'LEFT';await saveRecord(n);showCase(n.id);toast('Student marked '+n.stuStatus);return}
 if(t.dataset.del){const r=S.records.find(x=>x.id===t.dataset.del);closeDlg();if(r&&await ask(`Delete ${r.ref} (${r.name})? This cannot be undone.`,'Delete','Delete UFM case')){await deleteRecord(r.id);toast('Case deleted')}return}
 if(t.dataset.stu){S.sq=t.dataset.stu.split('|')[0];S.scls='';S.sshow='';location.hash='#students';return}
 if(t.dataset.id){showCase(t.dataset.id);return}
 const a=t.dataset.act;
 if(a==='xls')exportXls();
 else if(a==='importx')$('#fileX').click();
 else if(a==='restore')$('#fileJ').click();
 else if(a==='backup')saveFile(`SJS_UFM_Backup_${today()}.json`,JSON.stringify({app:'SJS-UFM',version:1,exported:new Date().toISOString(),settings:S.settings,records:S.records},null,1));
 else if(a==='printReg'){const rs=filtered().sort(byRef);printOut('UFM Record '+S.session,`<div class="reg">${regHead('Unfair Means (UFM) Conduct Record')}${regTable(rs)}${sigs()}</div>`,true)}
 else if(a==='printGive'){const rs=[...vis()].sort(byRef);printOut('UFM Give Out Register '+S.session,`<div class="reg">${regHead('UFM Give Out Register')}<table><thead><tr><th>Reference No.</th><th>Give out date</th><th>Roll</th><th>Student name</th><th>Class / Sec</th><th>Exam</th><th>Subject</th><th>Document given</th><th>Given to</th><th>Signature / remarks</th></tr></thead><tbody>${rs.map(r=>{const g=r.give||{};return`<tr><td>${esc(r.ref)}</td><td>${fd(g.date)}</td><td>${esc(r.roll)}</td><td>${esc(r.name)}</td><td>${esc(r.cls)} / ${esc(r.sec)}</td><td>${esc(r.exam)}</td><td>${esc(r.subject)}</td><td>${g.date?esc(g.doc):''}</td><td>${esc(g.to)}</td><td style="min-width:35mm">${esc(g.remarks)}</td></tr>`}).join('')}</tbody></table>${sigs()}</div>`,true)}
 else if(a==='printLetter'){const r=S.records.find(x=>x.id===S.letterId);if(r)printOut(`UFM Letter ${r.ref.split('/').pop()} ${r.name}`,letterHtml(r,$('#ldate').value||today()))}
 else if(a==='giveLetter'){const r=S.records.find(x=>x.id===S.letterId);if(r)giveForm(r)}
 else if(a==='batch'){const rs=[...vis()].filter(r=>!r.give?.date).sort(byRef);if(!rs.length){toast('Every letter has been given out');return}const d=$('#ldate')?.value||today();printOut(`UFM Pending Letters ${S.session}`,rs.map(r=>letterHtml(r,d)).join(''))}
 else if(a==='seed'){for(const [i,r] of SEED.entries())await saveRecord(Object.assign({id:'seed'+(i+1),createdAt:i+1},clone(r)));toast(SEED.length+' cases added')}
 else if(a==='upload'){const loc=lsGet(LSK);if(!loc?.records?.length)return;if(loc.settings)S.settings=Object.assign(clone(DEF),loc.settings);await saveSettings();for(const r of loc.records)await saveRecord(r);toast(`Uploaded ${loc.records.length} records`)}
 else if(a==='wipe'){if(await ask(`Delete all ${S.records.length} UFM cases? Make a backup first — this cannot be undone.`,'Delete all','Delete all records')){const ids=S.records.map(r=>r.id);for(const id of ids)await deleteRecord(id);toast('All records deleted')}}
});
$('#fileX').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importExcel(f)};
$('#fileJ').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)restoreJson(f)};
$('#sessSel').onchange=e=>{S.session=e.target.value;lsSet('sjs-ufm-sess',S.session);render()};
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
window.addEventListener('hashchange',go);

/* ---------- start ---------- */
function setSync(t,on){const s=$('#sync');s.textContent=t;s.classList.toggle('on',!!on)}
function gate(kind,extra){
 const g=$('#gate');if(kind==='ok'){g.hidden=true;return}g.hidden=false;
 const head=`<img src="${LOGO}" alt=""><h2>UFM Record</h2>`;
 const M={
  nosdk:`${head}<p>Could not load. Check the internet connection and open again.</p><button class="btn pri" id="grl">Reload</button>`,
  nocfg:`${head}<p>The SJS App's Firebase settings could not be found from this page.</p><p class="note">Keep <b>ufm.html</b> in the same GitHub repository as the SJS App (next to marks.html), then reload.</p><button class="btn pri" id="grl">Reload</button>`,
  signin:`${head}<p>Please sign in on the SJS App Home screen first.</p><a class="btn pri" href="./">Go to SJS Home</a>`,
  wait:`${head}<p>Checking your access…</p>`,
  denied:`${head}<p>UFM Record is confidential. It opens only for the <b>Admin</b>, <b>Principal</b> and <b>Exam In-Charge</b>.</p><a class="btn" href="./">← Back to SJS Home</a>`,
  error:`${head}<p>Something went wrong: ${esc(extra||'')}</p><button class="btn pri" id="grl">Reload</button>`};
 g.innerHTML=`<div class="gbox">${M[kind]}</div>`;const rl=$('#grl');if(rl)rl.onclick=()=>location.reload();
}
async function findConfig(){
 if(UFM_FIREBASE_OVERRIDE&&UFM_FIREBASE_OVERRIDE.apiKey)return UFM_FIREBASE_OVERRIDE;
 if(window.SJS_FIREBASE&&window.SJS_FIREBASE.apiKey)return window.SJS_FIREBASE;
 const K='sjs-ufm-fbcfg',keys=['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId','measurementId'];
 const grab=t=>{const o={};keys.forEach(k=>{const m=t.match(new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']'));if(m)o[k]=m[1]});return o.apiKey&&o.projectId?o:null};
 const queue=['marks.html','school.html','attendance.html','index.html','timetable.html'],seen=new Set();
 while(queue.length&&seen.size<16){const u=queue.shift();if(seen.has(u))continue;seen.add(u);let t='';
  try{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)continue;t=await r.text()}catch(e){continue}
  const c=grab(t);if(c){lsSet(K,c);return c}
  if(/\.html$/.test(u))[...t.matchAll(/<script[^>]+src=["']([^"':?#]+\.js)/gi)].forEach(m=>{const f=m[1].replace(/^\.\//,'');if(!/sjs-nav|sjs-common|(^|\/)sw\.js/.test(f)&&!seen.has(f))queue.push(f)})}
 return lsGet(K);
}
async function checkRole(u){
 const RK='sjs-role-'+u.uid,saved=lsGet(RK);let isAdmin=false,role='teacher';
 if(!navigator.onLine&&saved){isAdmin=!!saved.a;role=saved.r||'teacher'}
 else{try{await S.fs.collection('att_links').limit(1).get({source:'server'});isAdmin=true}catch(e){isAdmin=false;if(saved&&!(e&&e.code==='permission-denied'))isAdmin=!!saved.a}
  try{const d=await S.fs.doc('att_staff/'+u.uid).get();if(d.exists&&d.data().role)role=d.data().role}catch(e){if(saved)role=saved.r||role}}
 return{isAdmin,role:isAdmin?'admin':role};
}
function stopSubs(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[];S.records=[];S.cloudReady=false}
function startSubs(){
 const fs=S.fs;setSync('Connecting…');
 S.unsubs.push(fs.collection('ufm_records').onSnapshot({includeMetadataChanges:true},snap=>{
  S.records=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));const m=snap.metadata;if(!m.fromCache)S.cloudReady=true;
  setSync(m.hasPendingWrites?'Saving…':m.fromCache?'Offline · will save':'Online · saved',!m.fromCache&&!m.hasPendingWrites);soft()},
  e=>{setSync('Not connected');if(e.code==='permission-denied'){gate('error','Firebase refused to open the UFM records. The Admin must add the UFM part to the Firestore rules (UFM_firestore_rules.txt).')}else toast('Firebase: '+e.message)}));
 S.unsubs.push(fs.doc('ufm_settings/main').onSnapshot(d=>{if(d.exists){S.settings=Object.assign(clone(DEF),d.data());soft()}},()=>{}));
}
async function boot(){
 if(window.SJSNav){document.body.classList.add('in-sjs');const t=$('#ufmTool');t.append($('#sync'),$('#sessSel'))}
 S.session=lsGet('sjs-ufm-sess')||S.settings.current;
 buildNav();derive();fillSess();go();setSync('Connecting…');
 if(typeof firebase==='undefined'){gate('nosdk');return}
 gate('wait');
 const cfg=await findConfig();if(!cfg){gate('nocfg');return}
 try{if(!firebase.apps.length)firebase.initializeApp(cfg)}catch(e){gate('error',e.message);return}
 S.fs=firebase.firestore();try{await S.fs.enablePersistence({synchronizeTabs:true})}catch(e){}
 firebase.auth().onAuthStateChanged(async u=>{
  stopSubs();
  if(!u){S.user=null;gate('signin');setSync('Not signed in');refresh();return}
  S.user=u;gate('wait');
  const r=await checkRole(u);S.isAdmin=r.isAdmin;
  if(!(r.isAdmin||r.role==='principal'||r.role==='exam')){gate('denied');return}
  S.role=r.isAdmin?'Admin':r.role==='principal'?'Principal':'Exam In-Charge';
  gate('ok');startSubs();refresh();
 });
}
boot();
}
